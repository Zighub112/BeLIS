let NOTE_SEL=null,NOTE_DIRTY=false;
const sichtbareNotizen=()=>S.notizen.filter(n=>n.vis==='alle'||n.von_pid===USER.pid);
V.notizen={t:'Notizen',neuLabel:'Neue Notiz',delAll:true,
 count:()=>sichtbareNotizen().length||'',
 noLiveRender:()=>{const a=document.activeElement;return !!(a&&a.closest&&a.closest('#noteEd'))},
 render(){
  const q=fil('q').toLowerCase();
  const L=sichtbareNotizen().filter(n=>!q||(n.titel+' '+n.text).toLowerCase().includes(q)).sort((a,b)=>(b.pin?1:0)-(a.pin?1:0)||(a.geaendert<b.geaendert?1:-1));
  if(!NOTE_SEL||!L.find(n=>n.id===NOTE_SEL))NOTE_SEL=L.length?L[0].id:null;
  const n=L.find(x=>x.id===NOTE_SEL);const mine=n&&(n.von_pid===USER.pid||isBL());
  return `<div class="notes"><div class="nlist"><input type="search" data-fil="q" value="${esc(fil('q'))}" placeholder="Notizen durchsuchen" style="margin-bottom:6px">
   ${L.map(x=>`<button class="nitem${x.id===NOTE_SEL?' act':''}" data-note="${x.id}" style="border-left-color:${farbe(x.von_pid)};${x.id===NOTE_SEL?'':`background:${hexA(farbe(x.von_pid),.06)}`}"><b>${x.pin?'📌 ':''}${esc(x.titel||'(ohne Titel)')}</b><span>${esc(String(x.text||'').replace(/\s+/g,' ').slice(0,70))}</span><small>${pdot(x.von_pid)}${fmtTs(x.geaendert)} · ${esc(kurzName(x.von_pid))} · ${x.vis==='alle'?'für alle':'privat'}</small></button>`).join('')||'<div style="color:var(--tx3);padding:8px">Keine Notizen. Mit „Neue Notiz“ (F2) anlegen.</div>'}</div>
   <div class="ned" id="noteEd"${n?` style="border-top:4px solid ${farbe(n.von_pid)}"`:''}>${n?`<div class="filterbar" style="margin-bottom:6px"><input type="text" id="nTit" value="${esc(n.titel)}" placeholder="Titel" style="flex:1;font-weight:600"${mine?'':' readonly'}>
    <select id="nVis" style="width:auto"${n.von_pid===USER.pid?'':' disabled'}>${opts([{v:'privat',l:'privat (nur ich)'},{v:'alle',l:'für alle sichtbar'}],n.vis)}</select>
    <label style="white-space:nowrap"><input type="checkbox" id="nPin"${n.pin?' checked':''}${mine?'':' disabled'}> anheften</label></div>
    <textarea id="nTxt" style="flex:1;min-height:340px;font:13px/1.5 'Segoe UI',Tahoma,sans-serif"${mine?'':' readonly'} placeholder="Notiz …">${esc(n.text)}</textarea>
    <div id="nInfo" style="color:var(--tx3);margin-top:4px">Angelegt von ${esc(kurzName(n.von_pid))} am ${fmtTs(n.erstellt)} · zuletzt geändert ${fmtTs(n.geaendert)}${mine?' · wird automatisch gespeichert':' · nur lesen'}</div>`:'<div style="color:var(--tx3);padding:20px">Keine Notiz ausgewählt.</div>'}</div></div>`;
 },
 after(){
  document.querySelectorAll('#vBody [data-note]').forEach(b=>b.onclick=()=>{NOTE_SEL=b.dataset.note;SEL.notizen=NOTE_SEL;render()});
  const n=S.notizen.find(x=>x.id===NOTE_SEL);if(!n)return;SEL.notizen=n.id;
  let tm=null;const upd=()=>{clearTimeout(tm);NOTE_DIRTY=true;tm=setTimeout(()=>{if(!S.notizen.includes(n))S.notizen.push(n);n.titel=$('#nTit').value.trim();n.text=$('#nTxt').value;n.geaendert=new Date().toISOString();save('notizen');NOTE_DIRTY=false;
   const it=document.querySelector(`#vBody [data-note="${n.id}"]`);if(it){it.querySelector('b').textContent=(n.pin?'📌 ':'')+(n.titel||'(ohne Titel)');it.querySelector('span').textContent=n.text.replace(/\s+/g,' ').slice(0,70)}
   const inf=$('#nInfo');if(inf)inf.textContent='Gespeichert '+new Date().toLocaleTimeString('de-DE')},600)};
  const t=$('#nTit'),x=$('#nTxt');if(t&&!t.readOnly)t.oninput=upd;if(x&&!x.readOnly)x.oninput=upd;
  const fl=()=>{if(PENDING_RENDER&&!NOTE_DIRTY){PENDING_RENDER=false;setTimeout(()=>{if(!V.notizen.noLiveRender())render()},50)}};if(t)t.onblur=fl;if(x)x.onblur=fl;
  const v=$('#nVis');if(v)v.onchange=()=>{n.vis=v.value;n.geaendert=new Date().toISOString();save('notizen');log('Notiz '+(n.vis==='alle'?'freigegeben':'auf privat gesetzt'),n.titel);render()};
  const p=$('#nPin');if(p)p.onchange=()=>{n.pin=p.checked;save('notizen');render()};
 },
 neu(){const n={id:uid(),titel:'Neue Notiz',text:'',vis:'privat',pin:false,von_pid:USER.pid,erstellt:new Date().toISOString(),geaendert:new Date().toISOString()};S.notizen.push(n);NOTE_SEL=n.id;save('notizen');render();setTimeout(()=>{const t=$('#nTit');if(t){t.focus();t.select()}},30)},
 edit(id){NOTE_SEL=id;render()},
 del(id){id=id||NOTE_SEL;const n=S.notizen.find(x=>x.id===id);if(!n)return;if(n.von_pid!==USER.pid&&!isBL()){toast('Nur eigene Notizen können gelöscht werden.',true);return}confirmDlg('Notiz löschen',`Notiz „${esc(n.titel)}“ löschen?`,()=>{S.notizen=S.notizen.filter(x=>x.id!==id);NOTE_SEL=null;delete SEL.notizen;save('notizen');render()},'Löschen')},
 print(){const n=S.notizen.find(x=>x.id===NOTE_SEL);if(!n){toast('Keine Notiz ausgewählt.',true);return}
  printDoc(`<div class="paper">${kopf()}<div class="dtitel">Notiz – ${esc(n.titel)}</div>${para(n.text)}<div class="dver">Verfasst von ${esc(kurzName(n.von_pid))} · ${fmtTs(n.erstellt)} · zuletzt geändert ${fmtTs(n.geaendert)}</div>${fuss()}</div>`,'Notiz')}
};

/* ---- Gestaltung nach Vorlage Polizei Reuth ---- */
function kopf(){return `<div class="prep"><img src="${IMG_KOPF}" alt=""></div><div class="dhead"><div class="dlogo"><img src="${IMG_KOPF}" alt="Polizei Nordrhein-Westfalen – Reuth Innenstadt-Ost"></div><div class="dbar">${esc(S.meta.slogan||'')}</div></div>`}
function fuss(){return `<div class="dfuss">${esc(S.meta.kennzeichnung||'')}</div><div class="pfuss">${esc(S.meta.kennzeichnung||'')}</div>`}
function signer(kennung){const k=(kennung||(USER&&USER.kennung)||'').toUpperCase();return S.personal.find(p=>p.nachname.toUpperCase()===k)||(USER?person(USER.pid):null)}
function zeichnung(p){if(!p)return {vz:'',name:'',fkt:''};const bl=csv(S.meta.rollenBL);const leiter=bl[0]===p.dg;const vz=rolleOf(p)==='Behördenleitung'?(leiter?'':'In Vertretung'):'Im Auftrag';const vn=p.vorname&&p.vorname.toLowerCase()!==p.nachname.toLowerCase()?p.vorname:'';return {vz,name:[p.titel,vn,p.nachname].filter(Boolean).join(' '),fkt:amtG(p.dg,p.anrede)}}
function amtG(k,anrede){let n=rank(k).n;if(anrede==='Herr')n=n.replace('Erste/r','Erster').replace('Leitende/r','Leitender').replace(/\/-[^\s/]+/,'').replace('/in','');else if(anrede==='Frau')n=n.replace('Erste/r','Erste').replace('Leitende/r','Leitende').replace(/rat\/-r(\S+)/,(m,x)=>'r'+x).replace('/in','in');return n}
const zumZur=a=>a==='Herr'?'zum':a==='Frau'?'zur':'zur/zum';
const besGr=k=>{const b=rank(k).bes;if(!b||/anw/i.test(b))return '';return `(BesGr.${b.replace(/^A\s*/,'').replace(/\s+/g,'')})`};
function sgh(p){const n=esc(p.nachname);return `<p class="dsal">${p.anrede==='Herr'?'Sehr geehrter Herr '+esc(drAnrede(p))+n:p.anrede==='Frau'?'Sehr geehrte Frau '+esc(drAnrede(p))+n:'Guten Tag '+esc(vollName(p))},</p>`}
const vollName=p=>[p.titel,p.vorname,p.nachname].filter(Boolean).join(' ');
const drAnrede=p=>(p.titel&&/^(Prof\.\s*)?Dr/.test(p.titel))?p.titel.replace(/^(Prof\.\s*)?(Dr\.)(\s*\w+\.)*.*$/,'$1$2')+' ':'';
function sb(){const p=USER?person(USER.pid):null;return p?(p.vorname?p.vorname[0]+'. ':'')+p.nachname:''}
/* Textauszeichnung: Leerzeile = Absatz, "## " = fette Zwischenüberschrift, "- " = Aufzählung (eingerückte Folgezeilen gehören dazu), **fett** */
function inl(t){return esc(t).replace(/__(.+?)__/g,'<u>$1</u>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')}
function para(t){
 const L=String(t||'').replace(/\r/g,'').split('\n');let h='',ul=null,pbuf=[];
 const flushP=()=>{if(pbuf.length){h+=`<p>${pbuf.map(inl).join('<br>')}</p>`;pbuf=[]}};
 const flushU=()=>{if(ul){h+=`<ul class="dul">${ul.map(li=>`<li>${li.map((x,i)=>i===0?inl(x):inl(x)).join('<br>')}</li>`).join('')}</ul>`;ul=null}};
 L.forEach(line=>{
  if(!line.trim()){flushP();flushU();return}
  const m=line.match(/^\s*(?:[-•●*])\s+(.*)$/);
  if(m&&!/^\*\*/.test(line.trim())){flushP();ul=ul||[];ul.push([m[1]]);return}
  if(ul&&/^\s{2,}\S/.test(line)){ul[ul.length-1].push(line.trim());return}
  flushU();
  if(/^##\s+/.test(line)){flushP();h+=`<p class="dh">${inl(line.replace(/^##\s+/,''))}</p>`;return}
  pbuf.push(line.trim());
 });flushP();flushU();return h;
}
/* Unterschrift in Schreibschrift: Initiale des Vornamens und Nachname */
const schrift=p=>p?((p.vorname&&p.vorname.toLowerCase()!==String(p.nachname).toLowerCase()?p.vorname[0]+'. ':'')+p.nachname):'';
function brief({an,az,betreff,body,rbb,datum,signKennung,nachr}){
 const sg=signer(signKennung);const z=zeichnung(sg);
 return `<div class="paper">${kopf()}
 <div class="dmeta"><div class="dan">${an}</div><table class="dinfo"><tr><td>Aktenzeichen</td><td><b>${esc(az||'')}</b></td></tr><tr><td>Datum</td><td>${fmtD(datum||today())}</td></tr><tr><td>Bearbeitung</td><td>${esc(sb())}</td></tr></table></div>
 <div class="dtitel">${esc(betreff)}</div>${body}
 <div class="dsig"><p>Mit freundlichen Grüßen</p>${z.vz?`<p class="dvz">${esc(z.vz)}</p>`:''}${sg?`<div class="dschr">${esc(schrift(sg))}</div><p>${esc(z.name)}</p>`:`<p class="dsn">${esc(z.name)}</p>`}<p class="dsf">${esc(z.fkt)}</p></div>
 ${nachr?`<div class="dver">${nachr}</div>`:''}
 ${rbb?`<div class="drbb"><b>Rechtsbehelfsbelehrung</b><br>Gegen diese Verfügung kann innerhalb eines Monats nach Bekanntgabe Widerspruch erhoben werden. Der Widerspruch ist schriftlich oder zur Niederschrift bei der Behördenleitung des ${esc(S.meta.behoerde)} einzulegen.</div>`:''}${fuss()}</div>`;
}
const anP=p=>`${p.anrede==='Herr'?'Herrn':p.anrede==='Frau'?'Frau':''}<br><b>${esc(vollName(p))}</b><br>${esc(amtG(p.dg,p.anrede))}<br>${esc(p.dienststelle)}<br><i>– persönlich / vertraulich –</i>`;
function docUrkunde(p,dg,datum,art,signKennung){const m=S.meta;let sg=signer(signKennung);

let pdfLibsP=null;
function loadScript(u){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=u;s.onload=()=>res();s.onerror=()=>rej(new Error('Bibliothek nicht ladbar: '+u.split('/').pop()));document.head.appendChild(s)})}

/* Dokument auf A4-Seiten verteilen: Logo auf jeder Seite, blauer Balken nur auf Seite 1, Kennzeichnung unten auf jeder Seite */
function buildPdfPages(html){
 const host=document.createElement('div');host.style.cssText='position:fixed;left:-12000px;top:0;width:210mm;background:#fff;z-index:-1';document.body.appendChild(host);
 host.innerHTML=html;const src=host.querySelector('.paper');const pages=[];
 if(!src){host.remove();throw new Error('Kein Dokument')}
 if(src.classList.contains('urk')){src.style.cssText+=';height:297mm;min-height:297mm;box-shadow:none;margin:0';pages.push(src);return{host,pages}}
 const head=src.querySelector('.dhead'),wm=src.querySelector('.dwm'),fus=src.querySelector('.dfuss');
 const units=[];
 [...src.children].forEach(c=>{if(c.matches('.prep,.pfuss,.dhead,.dfuss,.dwm'))return;
  if(c.tagName==='UL')[...c.children].forEach(li=>units.push({li,cls:c.className}));
  else if(c.matches('table.t')&&c.tBodies[0]&&c.tBodies[0].rows.length>1)[...c.tBodies[0].rows].forEach(tr=>units.push({tr,thead:c.tHead,cls:c.className}));
  else units.push({el:c})});
 src.remove();
 const probe=document.createElement('div');probe.style.height='100mm';host.appendChild(probe);const pxmm=probe.getBoundingClientRect().height/100;probe.remove();
 let page,body,ul,tb,limit;
 const newPage=first=>{page=document.createElement('div');page.className='paper';page.style.cssText='height:297mm;min-height:297mm;overflow:hidden;box-shadow:none;margin:0';
  if(head){if(first)page.appendChild(head.cloneNode(true));else{const h=document.createElement('div');h.className='dhead';h.style.marginBottom='5mm';const lg=head.querySelector('.dlogo');if(lg)h.appendChild(lg.cloneNode(true));page.appendChild(h)}}
  if(wm)page.appendChild(wm.cloneNode(true));if(fus)page.appendChild(fus.cloneNode(true));
  body=document.createElement('div');page.appendChild(body);host.appendChild(page);pages.push(page);ul=null;tb=null;
  limit=page.getBoundingClientRect().top+pxmm*274;
 };
 const place=u=>{
  if(u.li){if(!ul){ul=document.createElement('ul');ul.className=u.cls;body.appendChild(ul)}const L=ul;L.appendChild(u.li);return()=>{u.li.remove();if(!L.children.length){L.remove();ul=null}}}
  if(u.tr){if(!tb){tb=document.createElement('table');tb.className=u.cls;if(u.thead)tb.appendChild(u.thead.cloneNode(true));tb.appendChild(document.createElement('tbody'));body.appendChild(tb)}const T=tb;T.tBodies[0].appendChild(u.tr);return()=>{u.tr.remove();if(!T.tBodies[0].rows.length){T.remove();tb=null}}}
  ul=null;tb=null;body.appendChild(u.el);return()=>u.el.remove();
 };
 const fits=()=>{const r=body.getBoundingClientRect();const last=body.lastElementChild;const mb=last?parseFloat(getComputedStyle(last).marginBottom)||0:0;return r.bottom-mb<=limit};
 newPage(true);
 let n=0;units.forEach(u=>{const undo=place(u);if(!fits()&&n>0){undo();newPage(false);n=0;place(u)}n++});
 return{host,pages};
}
function pdfName(html,title){const t=document.createElement('div');t.innerHTML=html;let n='';
 const u=t.querySelector('.paper.urk');if(u){n='Urkunde '+((t.querySelector('.unm')||{}).textContent||'')}
 else{n=((t.querySelector('.dtitel')||{}).textContent||title||'Dokument')}
 return (n.replace(/[\\/:*?"<>|]+/g,'-').replace(/\s+/g,'_').replace(/_+/g,'_').slice(0,110)||'Dokument')+'.pdf'}
async function makePdf(html,fname){
 await ensurePdfLibs();try{await document.fonts.ready}catch(e){}
 const{host,pages}=buildPdfPages(html);
 try{const{jsPDF}=window.jspdf;const pdf=new jsPDF({unit:'mm',format:'a4',orientation:'portrait',compress:true});
  for(let i=0;i<pages.length;i++){const c=await html2canvas(pages[i],{scale:2,backgroundColor:'#ffffff',logging:false,useCORS:true});if(i)pdf.addPage();pdf.addImage(c.toDataURL('image/jpeg',0.92),'JPEG',0,0,210,297,undefined,'FAST')}
  pdf.setProperties({title:fname.replace(/\.pdf$/,'').replace(/_/g,' '),creator:'BeLIS',author:USER?USER.name:''});
  pdf.save(fname);return pages.length}
 finally{host.remove()}
}
function printDoc(html,title){
 const raw=html;const fname=pdfName(raw,title);let busy=false;
 html=paginate(html);
 const d=openDlg({title:'Vorschau – '+title,size:'wide',body:`<div class="paperwrap">${html}</div>`,
  left:[{label:'Als PDF speichern',pri:true,close:false,fn:async a=>{if(busy)return;busy=true;const b=[...a.el.querySelectorAll('.df .btn')].find(x=>/PDF/.test(x.textContent));if(b){b.disabled=true;b.textContent='PDF wird erstellt …'}
    try{const n=await makePdf(raw,fname);toast(`PDF gespeichert: ${fname} (${n} Seite${n>1?'n':''})`);log('PDF erstellt',fname)}
    catch(e){toast('PDF konnte nicht erstellt werden: '+(e&&e.message||e),true)}
    finally{busy=false;if(b){b.disabled=false;b.textContent='Als PDF speichern'}}}}],
  buttons:[{label:'Schließen'}]});
 const fit=()=>{const w=d.q('.paperwrap');const pp=d.q('.paper');if(!w||!pp)return;const avail=w.clientWidth-32;const full=pp.offsetWidth;const s=Math.min(1,avail/full);pp.style.transform=s<1?`scale(${s})`:'';pp.style.transformOrigin='top left';pp.style.marginBottom=s<1?`${-(pp.offsetHeight*(1-s))}px`:'';pp.style.marginLeft=s<1?'0':''};
 setTimeout(fit,0);
}

 ['Extras',[['Führungskräfte & Zugänge','',()=>go('benutzer')],['Stammdaten','',()=>go('stammdaten')],['Protokoll','',()=>go('protokoll')]]],

];
function setTheme(t){if(t)document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme');try{localStorage.setItem('belis_theme',t)}catch(e){}}
function buildMenu(){
 const mb=$('#menubar');mb.innerHTML=MENU.map((m,i)=>`<div data-m="${i}"><button>${m[0]}</button><div class="menu">${m[1].map((it,j)=>it==='-'?'<hr>':`<button data-mi="${i}|${j}">${esc(it[0])}<span>${esc(it[1])}</span></button>`).join('')}</div></div>`).join('');
 let open=null;
 mb.querySelectorAll('[data-m]>button').forEach(b=>{const d=b.parentNode;b.onclick=e=>{e.stopPropagation();const was=d.classList.contains('open');mb.querySelectorAll('.open').forEach(x=>x.classList.remove('open'));if(!was){d.classList.add('open');open=d}else open=null};b.onmouseenter=()=>{if(open&&open!==d){open.classList.remove('open');d.classList.add('open');open=d}}});
 mb.querySelectorAll('[data-mi]').forEach(b=>b.onclick=e=>{e.stopPropagation();mb.querySelectorAll('.open').forEach(x=>x.classList.remove('open'));open=null;const [i,j]=b.dataset.mi.split('|');if(!USER)return;MENU[i][1][j][2]()});
 document.addEventListener('click',()=>{mb.querySelectorAll('.open').forEach(x=>x.classList.remove('open'));open=null});
}
const FK=[['F1','Hilfe',()=>help()],['F2','Neu',()=>tbAct('neu')],['F3','Suchen',()=>MENU[1][1][4][2]()],['F5','Aktualisieren',()=>tbAct('ref')],['F6','Personalakte',()=>pickPerson('Personalakte öffnen',id=>personalakte(id),{all:1,self:1,ex:1,ro:1})],['F8','PDF',()=>tbAct('print')],['F9','Übersicht',()=>go('cockpit')],['F10','Maßnahmen',()=>go('massnahmen')],['Esc','Schließen',()=>closeTop()]];
function buildFkeys(){$('#fkeys').innerHTML=FK.map((f,i)=>`<button data-fk="${i}"><b>${f[0]}</b>${f[1]}</button>`).join('');$('#fkeys').querySelectorAll('[data-fk]').forEach(b=>b.onclick=()=>{if(USER)FK[+b.dataset.fk][2]()})}
function closeTop(){const d=dlgStack[dlgStack.length-1];if(d)d.close()}
document.addEventListener('keydown',e=>{
 if(!USER)return;
 const inField=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
 const k=e.key;
 if(k==='Escape'){closeTop();return}
 if(dlgStack.length){return}
 const f=FK.find(x=>x[0]===k);if(f&&k!=='Esc'){e.preventDefault();f[2]();return}
 if(e.altKey&&/^[1-9]$/.test(k)){const ids=navIds();if(ids[+k-1]){e.preventDefault();go(ids[+k-1])}return}
 if(e.ctrlKey&&(k==='q'||k==='Q')){e.preventDefault();logout();return}
 if(inField)return;
 if(k==='Enter'){tbAct('edit')}
 else if(k==='Delete'){tbAct('del')}
 else if(k==='ArrowDown'||k==='ArrowUp'){const t=document.querySelector('#vBody table.grid');if(!t)return;const trs=[...t.querySelectorAll('tbody tr[data-id]')];if(!trs.length)return;e.preventDefault();let i=trs.findIndex(r=>r.classList.contains('sel'));i=k==='ArrowDown'?Math.min(trs.length-1,i+1):Math.max(0,i-1);trs[i].click();trs[i].scrollIntoView({block:'nearest'})}
});
function help(){openDlg({title:'Hilfe zu BeLIS',body:`<p style="margin-top:0"><b>BeLIS</b> ist das Führungsverfahren der Behördenleitung und der Wachbezirksleitungen. Es führt keinen vollständigen Personalbestand; Bedienstete werden erst erfasst, wenn zu ihnen ein Vorgang entsteht (Maßnahme, Verfahren, Antrag).</p>
 <p><b>Rollen.</b> Behördenleitung (${esc(csv(S.meta.rollenBL).join(', '))}): Vollzugriff. Leitung Wachbezirk (${esc(csv(S.meta.rollenLW).join(', '))}): im Wachbezirk Innenstadt-Ost Umsetzungen, Statusänderungen und Einleitung von Disziplinarverfahren. <b>Beförderungen</b> gibt es nur in Ämter des höheren Dienstes; sie verfügt ausschließlich die Behördenleitung. Beförderungen, Versetzungen in andere Bereiche, Suspendierungen und Entlassungen laufen als <b>Antrag</b> an die Behördenleitung.</p>
 <dl class="kv"><dt>Übersicht</dt><dd>Vorgangslage, Fristen, Führungskräfte, letzte Maßnahmen.</dd><dt>Organisation</dt><dd>Organisationsplan mit allen Abteilungen und Funktionen; vakante Stellen können direkt ausgeschrieben werden.</dd><dt>Anträge</dt><dd>Mitzeichnung zwischen Wachbezirk und Behördenleitung.</dd><dt>Personalmaßnahmen</dt><dd>Einstellung, Beförderung, Versetzung, Status, Entlassung mit Urkunde bzw. Verfügung.</dd><dt>Disziplinarverfahren</dt><dd>Einleitung, Fristen, Abschluss; laufende Verfahren sperren Beförderungen.</dd><dt>Bewerbungen hD</dt><dd>Auswahlverfahren für Ämter des höheren Dienstes bis zur Ernennung.</dd><dt>Schriftgut</dt><dd>Dienstanweisungen, Rundschreiben, Stellenausschreibungen.</dd></dl>
 <p>F6 öffnet eine beliebige Personalakte. Doppelklick öffnet einen Datensatz, Spaltenköpfe sortieren.</p><p>Datenhaltung: Firebase Firestore (Projekt ${esc(FB_CFG.projectId)}), Änderungen anderer Nutzer erscheinen automatisch.</p>`,buttons:[{label:'OK',pri:true}]})}

/* Firebase-SDK: falls gstatic.com blockiert ist, Ersatzquelle jsDelivr verwenden */
const FB_SDK=['app','auth','firestore','functions'];
function ladeFirebaseErsatz(){return FB_SDK.reduce((p,n)=>p.then(()=>{if(n==='app'&&window.firebase&&firebase.initializeApp)return;if(n!=='app'&&window.firebase&&firebase[n==='firestore'?'firestore':n]&&n!=='functions')return;return new Promise(res=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-'+n+'-compat.js';s.onload=res;s.onerror=res;document.head.appendChild(s)})}),Promise.resolve())}
(async function init(){
 try{$('#tbLogo').src=IMG_STERN}catch(e){}
 try{const th=localStorage.getItem('belis_theme');if(th)setTheme(th)}catch(e){}
 try{localStorage.removeItem('belis_v1');localStorage.removeItem('belis_fail')}catch(e){}
 buildMenu();buildFkeys();

 setSync('Firebase');showLogin();
 if(!fbInit()){lgState('Anmeldedienst wird über Ersatzquelle geladen …');try{await ladeFirebaseErsatz()}catch(e){}}
 if(!fbInit()){lgState('');
  const lokal=location.protocol==='file:'||/claude\.ai|claudeusercontent|anthropic/.test(location.hostname)||window.self!==window.top;
  lgErr(lokal?'BeLIS ist hier nicht über die Hosting-Adresse geöffnet (Vorschau oder lokale Datei). Bitte die Seite über die eigene Adresse aufrufen, z. B. https://belis-22d63.web.app.':'Der Anmeldedienst (Firebase) konnte nicht geladen werden. Mögliche Ursachen: Werbeblocker/Datenschutz-Erweiterung blockiert gstatic.com bzw. jsdelivr.net, oder keine Internetverbindung. Bitte Blocker für diese Seite deaktivieren und neu laden.');
  return}
 let first=true;
 FB.auth.onAuthStateChanged(async u=>{if(!first)return;first=false;
  if(u&&!USER){lgState('Sitzung wird fortgesetzt …');await afterAuth(u)}
  loginReady();
 });
})();
