:root{
  --title:#1f4e79; --title2:#2b6399; --titletx:#fff;
  --chrome:#e3e6ea; --chrome2:#d5d9df; --panel:#f4f5f7; --field:#fff; --req:#fffbe1;
  --line:#a8b0ba; --line2:#c9cfd6; --tx:#1b1f24; --tx2:#4d5661; --tx3:#77808b;
  --sel:#cfe2f6; --selline:#5b8fc7; --hover:#e8f0f9; --zebra:#f7f8fa;
  --ok:#2e7d32; --warn:#a86400; --err:#b3261e; --info:#1f5f99;
  --okbg:#e3f1e4; --warnbg:#fdf0d9; --errbg:#fbe4e2; --infobg:#e2edf8;
  --paper:#fff; --paperTx:#111;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --title:#16395a; --title2:#1e4a73; --chrome:#2a2e34; --chrome2:#343941; --panel:#22262b; --field:#1a1d21; --req:#2e2b1c;
  --line:#555d67; --line2:#3d434b; --tx:#e6e8eb; --tx2:#b3bac2; --tx3:#8a939d;
  --sel:#23466b; --selline:#4f86c0; --hover:#2a3a4c; --zebra:#262a30;
  --okbg:#1f3322; --warnbg:#3a2e17; --errbg:#3d2120; --infobg:#1d2e40;
  --ok:#7bc47f; --warn:#e3a649; --err:#ef8a80; --info:#8bb8e8;
}}
:root[data-theme="dark"]{
  --title:#16395a; --title2:#1e4a73; --chrome:#2a2e34; --chrome2:#343941; --panel:#22262b; --field:#1a1d21; --req:#2e2b1c;
  --line:#555d67; --line2:#3d434b; --tx:#e6e8eb; --tx2:#b3bac2; --tx3:#8a939d;
  --sel:#23466b; --selline:#4f86c0; --hover:#2a3a4c; --zebra:#262a30;
  --okbg:#1f3322; --warnbg:#3a2e17; --errbg:#3d2120; --infobg:#1d2e40;
  --ok:#7bc47f; --warn:#e3a649; --err:#ef8a80; --info:#8bb8e8;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--chrome);color:var(--tx);font:12px/1.4 "Segoe UI",Tahoma,Verdana,Arial,sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--selline);outline-offset:1px}
#app{display:flex;flex-direction:column;height:100%}
/* Titelleiste */
.titlebar{background:linear-gradient(var(--title2),var(--title));color:var(--titletx);display:flex;align-items:center;gap:10px;padding:4px 10px;min-height:30px}
.titlebar .logo{width:18px;height:18px;border:1.5px solid #fff;display:grid;place-items:center;font-weight:700;font-size:10px}
.titlebar .t{font-weight:600}
.titlebar .sub{opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titlebar .sp{flex:1}
.titlebar .usr{opacity:.9;white-space:nowrap}
/* Menü */
.menubar{display:flex;background:var(--chrome);border-bottom:1px solid var(--line2);padding:0 4px;position:relative;z-index:30;flex-wrap:wrap}
.menubar>div{position:relative}
.menubar>div>button{background:none;border:0;padding:4px 9px;cursor:default}
.menubar>div>button:hover,.menubar>div.open>button{background:var(--sel)}
.menu{display:none;position:absolute;top:100%;left:0;background:var(--panel);border:1px solid var(--line);box-shadow:2px 2px 0 rgba(0,0,0,.18);min-width:230px;padding:2px 0}
.menubar>div.open .menu{display:block}
.menu button{display:flex;width:100%;background:none;border:0;text-align:left;padding:4px 22px;gap:18px}
.menu button span{margin-left:auto;color:var(--tx3)}
.menu button:hover{background:var(--selline);color:#fff}
.menu button:hover span{color:#e8eef5}
.menu hr{border:0;border-top:1px solid var(--line2);margin:3px 2px}
/* Toolbar */
.toolbar{display:flex;align-items:center;gap:2px;padding:3px 6px;background:var(--chrome);border-bottom:1px solid var(--line);flex-wrap:wrap}
.tb{display:inline-flex;align-items:center;gap:5px;background:none;border:1px solid transparent;padding:3px 7px;border-radius:2px;cursor:default;white-space:nowrap}
.tb:hover:not(:disabled){border-color:var(--line);background:var(--panel)}
.tb:disabled{opacity:.45}
.tb svg{width:15px;height:15px;flex:none}
.tsep{width:1px;height:20px;background:var(--line);margin:0 4px}
/* Body */
.main{flex:1;display:flex;min-height:0}
.nav{width:228px;flex:none;background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:6px 0}
.nav h4{margin:8px 10px 3px;font-size:11px;color:var(--tx3);font-weight:600}
.nav button{display:flex;align-items:center;gap:7px;width:100%;background:none;border:0;border-left:3px solid transparent;text-align:left;padding:4px 10px 4px 16px;cursor:default}
.nav button:hover{background:var(--hover)}
.nav button.act{background:var(--sel);border-left-color:var(--selline);font-weight:600}
.nav button .cnt{margin-left:auto;font-size:10.5px;color:var(--tx3);font-weight:400}
.nav button .cnt.w{color:var(--err);font-weight:600}
.navsel{display:none}
.content{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--panel)}
.vhead{display:flex;align-items:baseline;gap:12px;padding:8px 12px 6px;border-bottom:1px solid var(--line2);background:var(--chrome)}
.vhead h2{font-size:15px;margin:0;font-weight:600}
.vhead .bc{color:var(--tx3)}
.vbody{flex:1;overflow:auto;padding:10px 12px}
/* Statusleiste */
.fkeys{display:flex;gap:1px;background:var(--line2);border-top:1px solid var(--line);flex-wrap:wrap}
.fkeys button{flex:1;min-width:90px;background:var(--chrome);border:0;padding:3px 6px;text-align:left;cursor:default}
.fkeys button:hover{background:var(--hover)}
.fkeys b{display:inline-block;min-width:26px;color:var(--title2)}
.statusbar{display:flex;background:var(--chrome2);border-top:1px solid var(--line);font-size:11px;color:var(--tx2);flex-wrap:wrap}
.statusbar>div{padding:2px 9px;border-right:1px solid var(--line)}
.statusbar>div.f{flex:1}
/* Tabellen */
.filterbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.filterbar label{color:var(--tx2)}
.tw{overflow:auto;border:1px solid var(--line);background:var(--field);max-width:100%}
table.grid{border-collapse:collapse;width:100%;min-width:640px}
.grid th{position:sticky;top:0;background:linear-gradient(var(--panel),var(--chrome2));border-right:1px solid var(--line2);border-bottom:1px solid var(--line);text-align:left;font-weight:600;padding:4px 7px;white-space:nowrap;z-index:1;cursor:default}
.grid td{padding:3px 7px;border-right:1px solid var(--line2);white-space:nowrap;max-width:320px;overflow:hidden;text-overflow:ellipsis}
.grid tbody tr:nth-child(even){background:var(--zebra)}
.grid tbody tr:hover{background:var(--hover)}
.grid tbody tr.sel{background:var(--sel);outline:1px dotted var(--selline);outline-offset:-1px}
.grid td.num{text-align:right;font-variant-numeric:tabular-nums}
.grid .empty td{padding:22px;text-align:center;color:var(--tx3);white-space:normal}
.mono{font-family:Consolas,"Lucida Console",monospace;font-size:11.5px}
.st{display:inline-block;padding:0 6px;border:1px solid;border-radius:2px;font-size:11px;line-height:16px}
.st.ok{color:var(--ok);background:var(--okbg)}
.st.warn{color:var(--warn);background:var(--warnbg)}
.st.err{color:var(--err);background:var(--errbg)}
.st.info{color:var(--info);background:var(--infobg)}
.st.n{color:var(--tx2);background:var(--chrome)}
.rcount{color:var(--tx3);margin-top:5px;font-size:11px}
/* Gruppenrahmen */
fieldset{border:1px solid var(--line);margin:0 0 10px;padding:6px 10px 10px;background:var(--panel);min-width:0}
legend{padding:0 4px;color:var(--title2);font-weight:600}
:root[data-theme="dark"] legend{color:var(--info)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) legend{color:var(--info)}}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px}
.kv dt{color:var(--tx2)}.kv dd{margin:0;font-variant-numeric:tabular-nums}
.bar{display:flex;align-items:center;gap:6px;margin:2px 0}
.bar .l{width:120px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .b{height:12px;background:var(--selline);min-width:1px}
.bar .v{color:var(--tx2);font-variant-numeric:tabular-nums}
ul.wv{list-style:none;margin:0;padding:0}
ul.wv li{display:flex;gap:8px;padding:3px 0;border-bottom:1px dotted var(--line2);align-items:baseline}
ul.wv li:last-child{border-bottom:0}
ul.wv .d{width:74px;flex:none;color:var(--tx2);font-variant-numeric:tabular-nums}
ul.wv a{color:inherit;cursor:pointer;text-decoration:underline dotted}
.hint{padding:6px 9px;border:1px solid;margin-bottom:8px}
.hint.warn{background:var(--warnbg);color:var(--warn)}
.hint.err{background:var(--errbg);color:var(--err)}
.hint.info{background:var(--infobg);color:var(--info)}
/* Formulare */
.form{display:grid;grid-template-columns:150px 1fr;gap:5px 10px;align-items:center}
.form label{color:var(--tx2);text-align:right}
.form label.req::after{content:" *";color:var(--err)}
.form .full{grid-column:1/-1}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=search],input[type=password],select,textarea{background:var(--field);border:1px solid var(--line);border-top-color:#7d8691;border-radius:0;padding:2px 5px;min-height:22px;width:100%}
input.req,select.req,textarea.req{background:var(--req)}
input[readonly]{background:var(--chrome);color:var(--tx2)}
input.bad,select.bad,textarea.bad{border-color:var(--err);outline:1px solid var(--err)}
textarea{min-height:70px;resize:vertical}
.btn{background:linear-gradient(var(--field),var(--chrome2));border:1px solid var(--line);border-bottom-color:#6f7984;padding:3px 14px;min-width:84px;border-radius:2px;cursor:default}
.btn:hover{border-color:var(--selline)}
.btn.pri{border-color:var(--selline);font-weight:600}
.btn:disabled{opacity:.5}
/* Dialog */
.overlay{position:fixed;inset:0;background:rgba(20,28,40,.35);display:flex;align-items:center;justify-content:center;z-index:250;padding:12px}
.dlg{background:var(--panel);border:1px solid var(--title);box-shadow:4px 4px 0 rgba(0,0,0,.22);width:min(720px,100%);max-height:100%;display:flex;flex-direction:column}
.dlg.wide{width:min(980px,100%)}

ienstanweisung gelten für die Nutzung der MP5 folgende Vorgaben:\n\n- Eine Aufrüstung darf **nur erfolgen**, wenn diese aufgrund der Einsatzlage erforderlich und verhältnismäßig ist.\n- Jeder Beamte ist berechtigt, eigenständig über eine Aufrüstung zu entscheiden.\n- Eine missbräuchliche oder nicht einsatzbezogene Nutzung der MP5 ist untersagt und kann disziplinarische Maßnahmen nach sich ziehen.\n- Mit dem Führen der MP5 gilt der Beamte als **aufgerüstet**.\n\nNach erfolgter Aufrüstung ist diese **unverzüglich im Funkkreis unter Angabe der Fahrzeugkennung bekannt zu geben.**\n\n## Beispiel:\n\n## „20/01 rüstet auf.“\n\nAlle Einsatzkräfte werden angewiesen, diese Vorgaben verbindlich einzuhalten. Eine nicht den Vorgaben entsprechende Nutzung der MP5 ist zu unterlassen.\n\nVerstöße gegen diese Dienstanweisung stellen eine Verletzung dienstlicher Pflichten dar und können disziplinarrechtliche Maßnahmen nach sich ziehen.\n\nDiese Dienstanweisung tritt mit ihrer Veröffentlichung in Kraft und gilt bis auf Widerruf."}, {"az": "04/08/2026", "datum": "2026-08-04", "titel": "Vorläufige Aufhebung der Freigabe von Zivilfahrten", "unterschrift": "", "text": "aufgrund wiederholt festgestellter Missstände und des nicht bestimmungsgemäßen Umgangs mit der durch die Behördenleitung für die Personalabteilung erteilten Freigabe von Zivilfahrten wird mit sofortiger Wirkung folgende Dienstanweisung erlassen:\n\nDie durch die Behördenleitung erteilte Freigabe für Zivilfahrten der Personalabteilung wird für den Zuständigkeitsbereich Interne Ermittlung wird bis auf Weiteres vorläufig aufgehoben.\n\nAb Veröffentlichung dieser Dienstanweisung gelten folgende Vorgaben:\n\n- Zivilfahrten sind bis auf Weiteres untersagt.\n- Ausnahmen bedürfen der ausdrücklichen Genehmigung der Kommissariatsleitung.\n- Eine eigenmächtige Inanspruchnahme der bisherigen Freigabe ist unzulässig.\n- Bereits erteilte Einzelgenehmigungen bleiben hiervon unberührt, sofern keine anderslautende Entscheidung der Kommissariatsleitung erfolgt.\n\nAlle Beschäftigten werden angewiesen, diese Vorgaben verbindlich einzuhalten. Zuwiderhandlungen werden als Verstoß gegen diese Dienstanweisung gewertet.\n\nVerstöße gegen diese Dienstanweisung stellen eine Verletzung dienstlicher Pflichten dar und können disziplinarrechtliche sowie weitere dienstrechtliche Maßnahmen nach sich ziehen.\n\nDiese Dienstanweisung tritt mit ihrer Veröffentlichung in Kraft und gilt bis auf Widerruf."}, {"az": "10/08/2026", "datum": "2026-08-10", "titel": "Befahrungsverbot der Gang-Gebiete und Zuständigkeit der Wache West", "unterschrift": "", "text": "aufgrund der besonderen Gefahrenlage innerhalb der ausgewiesenen Gang-Gebiete und zur eindeutigen Regelung der Zuständigkeiten bei Einsatzlagen wird mit sofortiger Wirkung folgende Dienstanweisung erlassen:\n\nDas Befahren der nachfolgend aufgeführten, ausgewiesenen Gang-Gebiete durch Polizeikräfte wird bis auf Weiteres grundsätzlich untersagt.\n\n## Als ausgewiesene Gang-Gebiete gelten insbesondere folgende Bereiche:\n\n- **Ballas-Gebiet – Davis / Grove Street**\n- **Families-Gebiet – Strawberry / Forum Drive**\n- **Vagos-Gebiet – Rancho / Jamestown Street**\n- **Marabunta-Gebiet – East Los Santos**\n- **The Lost MC-Gebiet – Sandy Shores / Grand Senora Desert**\n- **The Lost MC-Gebiet – Stab City**\n- **Triaden-Gebiet – La Mesa / Umgebung**\n- **Chamberlain-Gang-Gebiet – Chamberlain Hills**\n- **Benny's / Gang-Gebiet – Strawberry**\n- **Grove-Street-Gebiet – Davis**\n- **Rancho-Gang-Gebiet – Rancho**\n- **Strawberry-Gang-Gebiet – Strawberry**\n- **East-Los-Santos-Gang-Gebiet – East Los Santos**\n\nDie vorgenannten Bereiche gelten als besonders ausgewiesene Gebiete. Die Regelung umfasst dabei sowohl das gezielte Befahren der genannten Bereiche als auch die eigenständige Anfahrt zu allgemeinen Einsatzlagen innerhalb dieser Gebiete.\n\nAb Veröffentlichung dieser Dienstanweisung gelten folgende Vorgaben:\n\n- Das Befahren der ausgewiesenen Gang-Gebiete ist grundsätzlich untersagt.\n- Die eigenständige Anfahrt zu allgemeinen Einsätzen innerhalb dieser Gebiete ist ebenfalls untersagt.\n- Allgemeine Einsatzlagen innerhalb der Gang-Gebiete werden grundsätzlich durch die **Wache West** übernommen.\n- Einsatzaufträge innerhalb dieser Gebiete sind entsprechend an die Wache West weiterzuleiten.\n- Eine eigenständige Übernahme oder Anfahrt durch andere Einheiten ist nur nach ausdrücklicher Anweisung der Einsatzleitung oder bei einer unmittelbar bestehenden Gefahr für Leib und Leben zulässig.\n- Ausnahmen vom Befahrungsverbot bedürfen grundsätzlich der ausdrücklichen Genehmigung durch die zuständige Einsatzleitung.\n- Bei unklarer Gebietslage ist vor einer Anfahrt Rücksprache mit der Einsatzleitung zu halten.\n\nAlle Beschäftigten werden angewiesen, diese Vorgaben verbindlich einzuhalten. Eine eigenmächtige Anfahrt oder das eigenständige Befahren der ausgewiesenen Gang-Gebiete entgegen dieser Dienstanweisung ist unzulässig.\n\nVerstöße gegen diese Dienstanweisung stellen eine Verletzung dienstlicher Pflichten dar und können disziplinarrechtliche sowie weitere dienstrechtliche Maßnahmen nach sich ziehen.\n\nDiese Dienstanweisung tritt mit ihrer Veröffentlichung in Kraft und gilt bis auf Widerruf."}, {"az": "11/08/2026", "datum": "2026-08-11", "titel": "Melde- und Berichtspflicht nach Schussabgabe", "unterschrift": "", "text": "aufgrund der besonderen Bedeutung einer Schussabgabe im Rahmen eines Einsatzgeschehens und zur einheitlichen Regelung der **Melde- und Dokumentationspflichten** wird mit sofortiger Wirkung folgende Dienstanweisung erlassen:\n\nNach jeder Schussabgabe durch Polizeikräfte ist ein zuständiger Einsatzleiter unverzüglich über das Geschehen zu informieren. Darüber hinaus ist jede Schussabgabe vollständig und nachvollziehbar zu dokumentieren.\n\nAb Veröffentlichung dieser Dienstanweisung gelten folgende Vorgaben:\n\n- Jede Schussabgabe ist einem zuständigen Einsatzleiter unverzüglich zu melden.\n- Die Meldepflicht besteht unabhängig davon, ob eine Person getroffen, verletzt oder anderweitig geschädigt wurde.\n- Auch bei einer unbeabsichtigten Schussabgabe ist der Einsatzleiter unverzüglich zu informieren.\n- Die Meldung hat, soweit es die Einsatzlage zulässt, unmittelbar nach Beendigung der akuten Gefahrenlage zu erfolgen.\n- Ist ein zuständiger Einsatzleiter nicht erreichbar, ist die nächsthöhere erreichbare Führungskraft zu informieren.\n- Der Einsatzleiter ist anschließend über das Ereignis in Kenntnis zu setzen.\n- Nach jeder Schussabgabe ist durch einen zuständigen Einsatzleiter ein schriftlicher MDT Bericht über den Vorgang anzufertigen.\n- Der Bericht ist vollständig, sachlich und wahrheitsgemäß zu erstellen.\n- Der Bericht muss insbesondere den Zeitpunkt und Ort der Schussabgabe, die beteiligten Einsatzkräfte, den Anlass des Einsatzes, den Ablauf des Geschehens, die Anzahl der abgegebenen Schüsse sowie mögliche Verletzungen oder Sachschäden enthalten.\n- Zusätzlich sind sämtliche nach der Schussabgabe getroffenen Maßnahmen und verständigten Stellen im Bericht festzuhalten.\n- Die Erstellung des Berichtes hat grundsätzlich unverzüglich nach Beendigung der Einsatzlage zu erfolgen.\n- Sollte eine sofortige Berichtserstellung aufgrund der Einsatzlage nicht möglich sein, ist diese nach Wegfall des Hinderungsgrundes schnellstmöglich nachzuholen.\n- Die Verpflichtung zur Meldung und Dokumentation besteht unabhängig davon, ob die Schussabgabe aus dienstlicher Sicht gerechtfertigt war oder ob weitere Ermittlungs- oder Folgemaßnahmen eingeleitet werden.\n\nDer Einsatzleiter trägt hierbei die Verantwortung dafür, dass nach einer Schussabgabe eine ordnungsgemäße und vollständige Dokumentation des Vorgangs erfolgt.\n\nAlle Beschäftigten werden angewiesen, diese Vorgaben verbindlich einzuhalten. Eine unterlassene oder verspätete Meldung einer Schussabgabe sowie die nicht ordnungsgemäße Erstellung des erforderlichen Berichtes stellen eine Verletzung dienstlicher Pflichten dar.\n\nVerstöße gegen diese Dienstanweisung können disziplinarrechtliche sowie weitere dienstrechtliche Maßnahmen nach sich ziehen.\n\nDiese Dienstanweisung tritt mit ihrer Veröffentlichung in Kraft und gilt bis auf Widerruf."}, {"az": "30/08/2026", "datum": "2026-08-30", "titel": "Parkplatzordnung", "unterschrift": "C. Richter", "text": "aufgrund der Notwendigkeit einer einheitlichen Regelung zur Nutzung der dienstlich vorgesehenen Parkflächen sowie zur Sicherstellung eines geordneten und reibungslosen Dienstbetriebes wird mit sofortiger Wirkung folgende Dienstanweisung erlassen:\n\nAb Veröffentlichung dieser Dienstanweisung gelten für sämtliche dienstlichen Parkflächen die nachfolgenden verbindlichen Regelungen.\n\n## Die dienstlichen Parkflächen sind in folgende Parkzonen unterteilt:\n\n- **DiFi – Dienstführung**\n  Die Parkzone **DiFi** ist ausschließlich für Fahrzeuge der Dienstführung vorgesehen. Die Nutzung ist ausschließlich durch **PF, ELvD, ELD, FLT und FLZ** gestattet. Eine Nutzung durch andere Beschäftigte oder Fahrzeuge ist grundsätzlich nicht zulässig.\n- **EF-KZP – Einsatzfahrzeug Kurzzeitparkplatz**\n  Die Parkzone **EF-KZP** ist für sämtliche Dienstfahrzeuge vorgesehen, die lediglich kurzfristig abgestellt werden. Die maximale Standdauer beträgt **30 Minuten**. Nach Ablauf dieser Zeit ist das Fahrzeug unverzüglich auf eine dafür geeignete Parkfläche umzustellen, sofern kein besonderer dienstlicher Grund für eine längere Standdauer vorliegt.\n- **SON – Sonderfahrzeuge**\n  Die Parkzone **SON** ist ausschließlich für entsprechend vorgesehene **Sonderfahrzeuge** bestimmt. Eine Nutzung durch reguläre Dienstfahrzeuge oder Privatfahrzeuge ist nicht gestattet, sofern keine ausdrückliche Freigabe durch eine zuständige Führungskraft vorliegt.\n- **GAR – Garage**\n  Die Parkzone **GAR** umfasst die dienstlich vorgesehenen Garagenstellplätze. Eine Nutzung ist für die dafür vorgesehenen Fahrzeuge möglich und grundsätzlich auf **unbestimmte Zeit** zulässig, sofern keine anderweitige dienstliche Anweisung oder Einschränkung besteht.\n\nDarüber hinaus gelten folgende allgemeine Vorgaben:\n\n- Fahrzeuge sind ausschließlich innerhalb der für sie vorgesehenen Parkzonen abzustellen.\n- Die jeweils geltende Zweckbestimmung der einzelnen Parkzone ist zwingend einzuhalten.\n- Ein eigenmächtiges Wechseln oder dauerhafter Missbrauch einer Parkzone ist untersagt.\n- Zufahrten, Rettungswege, Feuerwehrzufahrten sowie sonstige notwendige Verkehrswege sind jederzeit freizuhalten.\n- Fahrzeuge sind so abzustellen, dass andere Fahrzeuge weder bei der Ein- noch bei der Ausfahrt behindert werden.\n- Ist eine längere Abstellzeit aufgrund einer Einsatzlage oder eines sonstigen dienstlichen Erfordernisses notwendig, ist das Fahrzeug auf eine hierfür geeignete Parkzone umzustellen oder eine entsprechende Freigabe durch eine zuständige Führungskraft einzuholen.\n- Sonderfahrzeuge dürfen ausschließlich in den dafür vorgesehenen Bereichen abgestellt werden.\n- Privatfahrzeuge dürfen grundsätzlich nicht auf den ausschließlich dienstlich vorgesehenen Parkflächen abgestellt werden.\n- Die zuständige Führungskraft kann bei besonderen Einsatzlagen oder dienstlichen Erfordernissen vorübergehende Abweichungen von der regulären Parkplatzordnung anordnen.\n- Den Anweisungen der zuständigen Führungskräfte hinsichtlich der Nutzung und Freihaltung der Parkflächen ist Folge zu leisten.\n\nDie jeweils zuständige Führungskraft trägt die Verantwortung dafür, dass die Nutzung der Parkflächen innerhalb ihres Zuständigkeitsbereiches entsprechend dieser Dienstanweisung erfolgt und festgestellte Verstöße entsprechend behandelt werden.\n\nAlle Beschäftigten werden angewiesen, die vorstehende Parkplatzordnung verbindlich einzuhalten. Eine unberechtigte Nutzung einer Parkzone, die Überschreitung der zulässigen Standdauer sowie das Blockieren oder unsachgemäße Abstellen von Fahrzeugen stellen einen Verstoß gegen diese Dienstanweisung dar.\n\nVerstöße gegen diese Dienstanweisung können dienstrechtliche beziehungsweise disziplinarrechtliche Maßnahmen nach sich ziehen.\n\nDiese Dienstanweisung tritt mit ihrer Veröffentlichung in Kraft und gilt bis auf Widerruf."}];

function parseDE(s){s=String(s||'').replace(/\s+/g,'');const m=s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);if(!m)return '';const y=+m[3];if(y<1900||y>2100)return '';return m[3]+'-'+pad(+m[2])+'-'+pad(+m[1])}
function rankFromText(t){
 const s=String(t||'').toLowerCase().replace(/\s+/g,' ').trim();if(!s)return '';
 const ex=R().find(r=>r.k.toLowerCase()===s);if(ex)return ex.k;
 const bes=(s.match(/\ba\s?(\d{1,2})\b/)||[])[1];
 const base=s.replace(/\(.*?\)/g,'').replace(/\ba\s?\d{1,2}\b/,'').replace(/besgr\.?\s*\d+/,'').trim();
 const cands=R().filter(r=>[amtG(r.k,'Herr'),amtG(r.k,'Frau'),r.n].some(n=>n.toLowerCase()===base));
 if(!cands.length)return '';
 if(bes){const c=cands.find(r=>r.bes.replace(/\s/g,'').toLowerCase()==='a'+bes);if(c)return c.k}
 return cands[0].k;
}

const AUTH_ERR={'auth/invalid-credential':'Nachname oder Kennwort ist falsch.','auth/wrong-password':'Nachname oder Kennwort ist falsch.','auth/user-not-found':'Nachname oder Kennwort ist falsch.','auth/invalid-email':'Nachname oder Kennwort ist falsch.','auth/invalid-login-credentials':'Nachname oder Kennwort ist falsch.','auth/user-disabled':'Dieses Konto wurde deaktiviert.','auth/too-many-requests':'Zu viele Fehlversuche. Die Anmeldung ist vorübergehend gesperrt – bitte später erneut versuchen.','auth/network-request-failed':'Keine Verbindung zum Anmeldedienst. Bitte Internetverbindung prüfen.'};
async function doLogin(){
 if(!LOGIN_READY)return;
 const k=$('#lgK').value.trim(),pw=$('#lgP').value;
 [$('#lgK'),$('#lgP')].forEach(e=>e.classList.toggle('bad',!e.value.trim()));
 if(!k||!pw)return;
 if(!fbInit()){lgErr('Der Anmeldedienst (Firebase) konnte nicht geladen werden.');return}
 $('#lgGo').disabled=true;lgState('Anmeldung läuft …');
 try{await FB.auth.signInWithEmailAndPassword(loginMail(k),pw)}
 catch(e){$('#lgGo').disabled=false;lgState('');lgErr('Anmeldung fehlgeschlagen: '+(AUTH_ERR[e&&e.code]||(e&&e.message)||e));return}
 try{localStorage.setItem('belis_last',k)}catch(e){}
 await afterAuth(FB.auth.currentUser,pw);
 const b=$('#lgGo');if(b)b.disabled=false;lgState('');
}
async function denyAuth(t){Store.reset();try{await FB.auth.signOut()}catch(e){}USER=null;S=emptyState();showLogin();loginReady();lgErr(t)}
/* nach erfolgreicher Firebase-Anmeldung: Daten laden, Personalakte und Berechtigung prüfen */
async function afterAuth(user,pw){
 if(!user)return;lgState('Daten werden geladen …');
 let any;
 try{any=await Store.loadAll()}
 catch(e){if(e&&e.code==='permission-denied'){
   /* Person wurde gelöscht? Dann entfernt sich das Anmeldekonto jetzt selbst */
   try{const g=await geloeschtDoc().get();const L=(g.exists&&g.data().emails)||[];
    if(L.includes(String(user.email||'').toLowerCase())){try{await user.delete();await denyAuth('Ihr BeLIS-Zugang wurde aufgehoben. Das Anmeldekonto wurde gelöscht.');}catch(x){await denyAuth('Ihr BeLIS-Zugang wurde aufgehoben.')}return}}catch(x){}
   await denyAuth('Kein Zugriff: Dieses Konto ist in den Zugriffsregeln der Datenbank nicht freigegeben.');return}const off=(e&&e.code==='unavailable')||/offline/i.test(String(e&&e.message));await denyAuth(off?'Die Datenbank ist nicht erreichbar. Bitte prüfen: (1) In der Firebase-Konsole unter „Firestore Database“ wurde eine Datenbank erstellt, mit der Datenbank-ID „(default)“. (2) Werbeblocker/Datenschutz-Erweiterungen für diese Seite deaktivieren. (3) Seite über http(s) öffnen, nicht als Datei.':'Daten konnten nicht geladen werden: '+(e&&e.message||e));return}
 if(!any||!S.personal.length){offerSetup(()=>afterAuth(user,pw));return}
 if(normalize())KEYS.forEach(k=>Store.push(k));
 const email=String(user.email||'').toLowerCase();
 let hits=S.personal.filter(p=>p.status!=='ausgeschieden'&&p.acc&&p.acc.login===email);
 if(!hits.length)hits=S.personal.filter(p=>p.status!=='ausgeschieden'&&rolleOf(p)&&!keinZugang(p)&&!(p.acc&&p.acc.login)&&(loginMail(p.nachname)===email||(p.dnr&&loginMail(p.dnr)===email)));
 if(hits.length>1){const h2=hits.filter(p=>p.acc&&p.acc.last);if(h2.length===1)hits=h2}
 if(hits.length>1){const h3=hits.filter(p=>p.acc&&p.acc.kontoAm);if(h3.length===1)hits=h3}
 if(hits.length>1){await denyAuth('Dieses Konto lässt sich nicht eindeutig zuordnen, weil mehrere Führungskräfte denselben Nachnamen haben. Die Behördenleitung muss unter „Führungskräfte & Zugänge“ den Zugang der betroffenen Person neu anlegen – die Anmeldung erfolgt dann mit der Personalnummer.');return}
 const p=hits[0];
 if(!p){await denyAuth(`Zu diesem Konto (${email.split('@')[0]}) gibt es keine passende Personalakte in BeLIS.`);return}
 const rolle=rolleOf(p);
 if(!rolle){await denyAuth(`Kein Zugang: BeLIS steht nur der Behördenleitung und der Leitung Wachbezirk zur Verfügung (Amt laut Personalakte: ${p.dg}).`);return}
 if(p.status==='suspendiert'){await denyAuth('Zugang gesperrt: vorläufige Dienstenthebung.');return}
 if(p.acc&&p.acc.gesperrt){await denyAuth('Der Zugang wurde durch die Behördenleitung gesperrt.');return}
 Store.listen();
 if(p.acc&&p.acc.must){changePw(p,true,()=>finishLogin(p));return}
 finishLogin(p);
}
function finishLogin(p){
 const rolle=rolleOf(p);
 USER={pid:p.id,kennung:p.nachname.toUpperCase(),name:p.nachname+', '+p.dg,rolle,wb:wbOf(p.dienststelle),login:new Date().toISOString()};
 p.acc=p.acc||{};p.acc.last=USER.login;if(!p.acc.login&&FB&&FB.auth.currentUser)p.acc.login=String(FB.auth.currentUser.email||'').toLowerCase();save('personal');
 try{kennungenBereinigen()}catch(e){}
 try{ensureFarben()}catch(e){}
 zugangSync(true);
 $('#login').style.display='none';
 CUR='cockpit';
 log('Anmeldung',rolle+(rolle==='Leitung Wachbezirk'?' – '+USER.wb:''));render();
 const offen=S.antraege.filter(a=>a.status==='offen').length;
 if(isBL()&&offen)toast(`${offen} Antrag/Anträge aus dem Wachbezirk zur Entscheidung.`);
}
async function fbLogout(){
 try{log('Abmeldung','');await Store.flush()}catch(e){}
 Store.reset();try{await FB.auth.signOut()}catch(e){}
 USER=null;S=emptyState();dlgStack.slice().forEach(d=>d.close());showLogin();loginReady();
}
function changePw(p,forced,done){
 const F=[...(forced?[]:[{k:'alt',l:'Bisheriges Kennwort',t:'password',req:1}]),{k:'pw1',l:'Neues Kennwort',t:'password',req:1},{k:'pw2',l:'Wiederholung',t:'password',req:1}];
 openDlg({title:'Kennwort ändern',size:'small',body:(forced?'<div class="hint warn">Für Ihr Konto ist ein Kennwortwechsel vorgesehen. Bitte legen Sie jetzt ein persönliches Kennwort fest.</div>':'')+formHtml(F,{})+'<div style="color:var(--tx3);margin-top:6px">Mindestens 8 Zeichen, Buchstaben und Ziffern.</div>',
  buttons:[{label:'Kennwort ändern',pri:true,fn:async a=>{const o=readForm(a,F);if(!o)return false;
   const e=pwPolicy(o.pw1);if(e){toast(e,true);return false}if(o.pw1!==o.pw2){toast('Die Kennwörter stimmen nicht überein.',true);return false}
   if(S.meta.stdPw&&o.pw1===S.meta.stdPw){toast('Das Standardkennwort darf nicht als persönliches Kennwort verwendet werden.',true);return false}
   const u=FB.auth.currentUser;if(!u){toast('Nicht angemeldet.',true);return false}
   try{
    if(!forced){await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email,o.alt))}
    await u.updatePassword(o.pw1);
   }catch(err){const c=err&&err.code;toast(c==='auth/wrong-password'||c==='auth/invalid-credential'?'Das bisherige Kennwort ist falsch.':c==='auth/requires-recent-login'?'Bitte zuerst ab- und wieder anmelden.':'Kennwort konnte nicht geändert werden: '+(err&&err.message||err),true);return false}
   p.acc=Object.assign(p.acc||{},{must:false,pwChanged:new Date().toISOString()});save('personal');a.close();
   if(USER)log('Kennwort geändert',p.nachname);toast('Kennwort geändert.');if(done)done();return false}},
  ...(forced?[{label:'Abmelden',fn:()=>{fbLogout()}}]:[{label:'Abbrechen'}])]});
}
function offerSetup(cont){
 openDlg({title:'Datenbank ohne Datenbestand',size:'small',body:`<p style="margin-top:0">Die Firestore-Datenbank enthält noch keinen BeLIS-Bestand.</p><p>Der Mandant <b>${esc(S.meta.behoerde)}</b> wird mit dem Organisationsstand vom 30.09.2026 eingerichtet (Behördenleitung, Leitung Wachbezirk, Abteilungen, Dienstanweisungen).</p><p>Vorhandene Daten aus der bisherigen Version können Sie danach über <b>Verwaltung › Datensicherung › Import</b> einspielen.</p>`,
  buttons:[{label:'Mandant einrichten',pri:true,fn:()=>{seedReuth();Promise.all(KEYS.map(k=>Store.write(k))).then(()=>cont&&cont())}},{label:'Abmelden',fn:()=>{fbLogout()}}]});
}
</script>
<script>
/* ================= Shell ================= */
let CUR='cockpit';const SEL={};const SORT={};const FIL={};
const V={};
const NAV_ALL=[
 ['Allgemein',['cockpit','kalender','todo','notizen','wv','antraege']],
 ['Personalwesen',['personal','org','massnahmen','disziplinar','bewerbungen']],
 ['Schriftverkehr',['schriftgut']],
 ['Verwaltung',['benutzer','stammdaten','protokoll','sicherung']]
];
const BL_ONLY=['bewerbungen','benutzer','stammdaten','protokoll','sicherung'];
const NAV=()=>NAV_ALL.map(([g,ids])=>[g,ids.filter(id=>isBL()||!BL_ONLY.includes(id))]).filter(g=>g[1].length);
const navIds=()=>NAV().flatMap(n=>n[1]);
function go(id){if(!navIds().includes(id)){toast('Kein Zugriff: Dieses Modul ist der Behördenleitung vorbehalten.',true);return}CUR=id;render();$('#vBody').scrollTop=0}
function render(){
 if(!USER)return;
 const m=S.meta;const me=person(USER.pid);
 if(me){const r=rolleOf(me);if(!r||['suspendiert','ausgeschieden'].includes(me.status)||(me.acc&&me.acc.gesperrt)){toast('Ihre Berechtigung ist entfallen. Sie wurden abgemeldet.',true);fbLogout();return}USER.rolle=r;USER.wb=wbOf(me.dienststelle);USER.name=me.nachname+', '+me.dg}
 if(!navIds().includes(CUR))CUR='cockpit';
 $('#tbBehoerde').textContent='Behördenleitungs-Informationssystem – '+m.behoerde;
 $('#tbUser').textContent=USER.name+' · '+USER.rolle+(isBL()?'':' '+USER.wb.replace(/^Wachbezirk\s*/,''));
 $('#sbUser').textContent='Angemeldet: '+USER.kennung+' · '+USER.rolle+(isBL()?'':' ('+USER.wb+')');
 $('#sbMandant').textContent='Mandant: '+m.behoerde;
 let h='';let sel='';
 NAV().forEach(([g,ids])=>{h+=`<h4>${g}</h4>`;sel+=`<optgroup label="${g}">`;ids.forEach(id=>{const v=V[id];const c=v.count?v.count():null;
  h+=`<button data-v="${id}" class="${id===CUR?'act':''}">${esc(v.t)}${c!=null&&c!==''?`<span class="cnt${v.warn&&v.warn()?' w':''}">${c}</span>`:''}</button>`;
  sel+=`<option value="${id}"${id===CUR?' selected':''}>${esc(v.t)}</option>`});sel+='</optgroup>'});
 $('#nav').innerHTML=h;$('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.v));
 $('#navSelect').innerHTML=sel;$('#navSelect').value=CUR;$('#navSelect').onchange=e=>go(e.target.value);
 const v=V[CUR];
 $('#vTitle').textContent=v.t;
 $('#vBc').textContent=NAV().find(n=>n[1].includes(CUR))[0]+' › '+v.t;
 renderToolbar();
 $('#vBody').innerHTML=v.render();
 if(v.after)v.after();
 bindGrid();
}
function renderToolbar(){
 const v=V[CUR];const hasSel=!!SEL[CUR];
 let h='';
 const b=(id,ic,l,dis,tip)=>`<button class="tb" data-tb="${id}"${dis?' disabled':''} title="${esc(tip||l)}">${svg(ic)}<span class="lbl">${esc(l)}</span></button>`;
 const allowed=x=>!x.bl||isBL();
 if(v.neu&&(!v.neuBL||isBL()))h+=b('neu','neu',v.neuLabel||'Neu',false,'Neu anlegen (F2)');
 if(v.edit)h+=b('edit','edit',v.editLabel||'Bearbeiten',!hasSel,'Öffnen/Bearbeiten (Enter)');
 if(v.del&&(v.delAll||isBL())&&(!v.delIf||v.delIf()))h+=b('del','del','Löschen',!hasSel,'Löschen (Entf)');
 const ex=(v.extra||[]).map((x,i)=>[x,i]).filter(([x])=>allowed(x));
 if(ex.length){h+='<span class="tsep"></span>';ex.forEach(([x,i])=>{h+=b('x'+i,x.ic||'doc',x.l,(x.sel&&!hasSel),x.tip)})}
 h+='<span class="tsep"></span>';
 if(v.print)h+=b('print','print','PDF',false,'Liste als PDF (F8)');
 h+=b('ref','ref','Aktualisieren',false,'Aktualisieren (F5)');
 h+='<span class="tsep"></span>'+b('logout','exit','Abmelden',false,'Abmelden');
 $('#toolbar').innerHTML=h;
 $('#toolbar').querySelectorAll('[data-tb]').forEach(e=>e.onclick=()=>tbAct(e.dataset.tb));
}
function tbAct(a){
 const v=V[CUR];const id=SEL[CUR];
 if(a==='neu'){if(v.neu){if(v.neuBL&&!needBL())return;v.neu()}}
 else if(a==='edit'){if(v.edit&&id)v.edit(id)}
 else if(a==='del'){if(v.del&&id){if(!v.delAll&&!needBL())return;if(v.delIf&&!v.delIf()){toast('Keine Berechtigung zum Löschen.',true);return}v.del(id)}}
 else if(a==='print'){if(v.print)v.print()}
 else if(a==='ref'){refresh()}
 else if(a==='logout'){logout()}
 else if(a[0]==='x'){const x=v.extra[+a.slice(1)];if(x.bl&&!needBL())return;if(x.sel&&!id)return;x.fn(id)}
}
async function refresh(){try{await Store.flush();await Store.loadAll()}catch(e){toast('Aktualisieren fehlgeschlagen: '+(e&&e.message||e),true)}render();msg('Ansicht aktualisiert '+new Date().toLocaleTimeString('de-DE'))}
function logout(){confirmDlg('Abmelden','Möchten Sie sich von BeLIS abmelden?',()=>{fbLogout()},'Abmelden')}

/* Tabellen */
function grid(view,cols,rows,emptyText){
 const st=SORT[view];
 if(st&&cols[st.i]){const c=cols[st.i];const key=c.s||(r=>String(c.f(r)).replace(/<[^>]+>/g,''));rows=rows.slice().sort((a,b)=>{const x=key(a),y=key(b);return (x>y?1:x<y?-1:0)*st.d})}
 let h=`<div class="tw"><table class="grid" data-view="${view}"><thead><tr>`+cols.map((c,i)=>`<th data-i="${i}"${c.w?` style="width:${c.w}"`:''}>${esc(c.l)}${st&&st.i===i?(st.d>0?' ▲':' ▼'):''}</th>`).join('')+'</tr></thead><tbody>';
 if(!rows.length)h+=`<tr class="empty"><td colspan="${cols.length}">${emptyText||'Keine Datensätze vorhanden.'}</td></tr>`;
 rows.forEach(r=>{h+=`<tr data-id="${esc(r.id)}" tabindex="-1" class="${SEL[view]===r.id?'sel':''}${r._dim?' dim':''}">`+cols.map(c=>`<td class="${c.num?'num':''}${c.mono?' mono':''}">${c.f(r)}</td>`).join('')+'</tr>'});
 return h+`</tbody></table></div><div class="rcount">${rows.length} Datensatz${rows.length===1?'':'e'}</div>`;
}
function bindGrid(){
 document.querySelectorAll('#vBody table.grid').forEach(t=>{
  const view=t.dataset.view;
  t.querySelectorAll('th').forEach(th=>th.onclick=()=>{const i=+th.dataset.i;const s=SORT[view];SORT[view]={i,d:s&&s.i===i?-s.d:1};render()});
  t.querySelectorAll('tbody tr[data-id]').forEach(tr=>{
   tr.onclick=()=>{SEL[view]=tr.dataset.id;t.querySelectorAll('tr.sel').forEach(x=>x.classList.remove('sel'));tr.classList.add('sel');renderToolbar();const v=V[view];if(v&&v.onSel)v.onSel(tr.dataset.id)};
   tr.ondblclick=()=>{SEL[view]=tr.dataset.id;const v=V[view];if(v&&v.edit)v.edit(tr.dataset.id)};
  });
 });
 document.querySelectorAll('#vBody [data-fil]').forEach(e=>{const k=e.dataset.fil;e.oninput=e.onchange=()=>{FIL[CUR]=FIL[CUR]||{};FIL[CUR][k]=e.value;
   const pos=e.selectionStart;render();const n=document.querySelector(`#vBody [data-fil="${k}"]`);if(n&&n.type==='search'){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}}});
 document.querySelectorAll('#vBody [data-act]').forEach(e=>e.onclick=ev=>{ev.preventDefault();ACT[e.dataset.act](e.dataset.id)});
}
const ACT={};
const fil=(k,d='')=>(FIL[CUR]&&FIL[CUR][k]!=null)?FIL[CUR][k]:d;
const ST_MAP={'nicht erfasst':'warn',aktiv:'ok',freigegeben:'ok','in Kraft':'ok',abgeschlossen:'n',bestanden:'ok',Zusage:'ok',Eingestellt:'ok',genehmigt:'ok',Ernannt:'ok',besetzt:'ok',vakant:'warn','n. b.':'n',Auswahlgespräch:'info',beurlaubt:'info',geplant:'info',laufend:'info',Entwurf:'n',Eingang:'info',Prüfung:'info',Einstellungstest:'info',Vorstellungsgespräch:'info','in Erprobung':'warn',Anhörung:'warn',eingeleitet:'warn',Ermittlung:'warn',offen:'warn',ausgesetzt:'n','krank gemeldet':'warn','im Urlaub':'info',abgemeldet:'warn',suspendiert:'err',gesperrt:'err',ausgesondert:'n',ausgeschieden:'n',Absage:'n',aufgehoben:'n',eingestellt:'n',abgelehnt:'err',zurückgezogen:'n','nicht bestanden':'err',überfällig:'err',erledigt:'n',inaktiv:'err'};
function stBadge(s){return `<span class="st ${ST_MAP[s]||'n'}">${esc(s||'–')}</span>`}

/* ================= Übersicht ================= */
function stehzeit(p){return p.befoerdert?daysBetween(p.befoerdert,today()):null}
const DISZ_ZU=['abgeschlossen','eingestellt'];
function openDisz(pid){return S.disziplinar.filter(d=>d.pid===pid&&!DISZ_ZU.includes(d.status))}
function derivedWV(){
 const t=today();const L=[];const sc=pid=>inScope(pid);
 S.disziplinar.forEach(d=>{if(d.frist&&!DISZ_ZU.includes(d.status)&&sc(d.pid))L.push({d:d.frist,t:`Frist Disziplinarverfahren ${d.az} (${pname(d.pid)}) – ${d.status}`,go:'disziplinar',id:d.id})});
 scopePersons().forEach(p=>{if(ABWESEND.includes(p.status)&&p.statusBis)L.push({d:p.statusBis,t:`Rückkehr erwartet: ${p.dg} ${p.nachname} (${p.status}) – Status prüfen`,go:'akte',id:p.id})});
 if(isBL())S.bewerbungen.forEach(b=>{if(b.status==='Eingang'&&daysBetween(b.eingang,t)>=7)L.push({d:addDays(b.eingang,7),t:`Bewerbung unbearbeitet: ${b.az} ${b.nachname}, ${b.vorname}`,go:'bewerbungen',id:b.id})});
 if(isBL())S.antraege.filter(a=>a.status==='offen').forEach(a=>L.push({d:a.datum,t:`Antrag ${a.az}: ${a.art} ${pname(a.pid)} (${a.summary}) – Entscheidung`,go:'antraege',id:a.id}));
 S.wv.filter(w=>!w.erledigt).forEach(w=>L.push({d:w.datum,t:w.text,go:'wv',id:w.id,man:true}));
 (S.todos||[]).filter(x=>!x.erledigt&&x.faellig&&betrifftMich(x.zustaendig)).forEach(x=>L.push({d:x.faellig,t:'Aufgabe: '+x.titel+(x.prio==='hoch'?' (hoch)':''),go:'todo',id:x.id}));
 return L.sort((a,b)=>a.d<b.d?-1:1);
}
V.cockpit={t:'Übersicht',
 count:()=>{const n=derivedWV().filter(w=>w.d<=today()).length;return n||''},warn:()=>true,
 extra:[{l:'Wiedervorlage',ic:'neu',fn:()=>V.wv.neu()},{l:'Personalakte öffnen',ic:'akte',fn:()=>pickPerson('Personalakte öffnen',id=>personalakte(id),{all:1,self:1,ro:1})}],
 render(){
  const t=today();const y=t.slice(0,4);
  const P=scopePersons();const ids=new Set(P.map(p=>p.id));
  const inM=S.massnahmen.filter(m=>ids.has(m.pid));const inY=inM.filter(m=>m.datum.startsWith(y));
  const n=a=>inY.filter(m=>m.art===a).length;
  const offD=S.disziplinar.filter(d=>ids.has(d.pid)&&!DISZ_ZU.includes(d.status));
  const fristD=offD.filter(d=>d.frist&&daysBetween(t,d.frist)<=7).length;
  const offA=S.antraege.filter(a=>a.status==='offen'&&(isBL()||a.von===USER.pid)).length;
  const susp=P.filter(p=>p.status==='suspendiert');
  const offB=S.bewerbungen.filter(b=>!['Absage','Ernannt'].includes(b.status)).length;
  const wv=derivedWV();const over=wv.filter(w=>w.d<t).length;
  const fk=S.personal.filter(p=>isHD(p.dg)&&p.status!=='ausgeschieden').sort((a,b)=>rankIdx(b.dg)-rankIdx(a.dg)||a.nachname.localeCompare(b.nachname));
  const hin=[];if(isBL()&&offA)hin.push(`${offA} Antrag/Anträge zur Entscheidung.`);if(fristD)hin.push(`${fristD} Disziplinarfrist(en) in den nächsten 7 Tagen.`);
  const scopeTxt=isBL()?'Gesamtbehörde':USER.wb;
  const last=inM.slice().sort((a,b)=>(a.datum+a.az)<(b.datum+b.az)?1:-1).slice(0,8);
  return `${over?`<div class="hint err">Es bestehen ${over} überfällige Wiedervorlage(n). ${hin.join(' ')}</div>`:hin.length?`<div class="hint warn">${hin.join(' ')}</div>`:''}
  <div class="cols">
  <fieldset><legend>Vorgangslage – ${esc(scopeTxt)}</legend><dl class="kv">
   <dt>${isBL()?'Anträge zur Entscheidung':'Eigene offene Anträge'}</dt><dd>${offA?`<a href="#" data-act="goantr" style="font-weight:600;${isBL()?'color:var(--err)':''}">${offA}</a>`:0}</dd>
   <dt>laufende Disziplinarverfahren</dt><dd>${offD.length}${fristD?` <span style="color:var(--warn)">(${fristD} mit Frist ≤ 7 Tage)</span>`:''}</dd>
   <dt>abwesend (Urlaub, abgemeldet, beurlaubt, krank)</dt><dd>${P.filter(p=>ABWESEND.includes(p.status)).length}</dd>
   <dt>vorläufig des Dienstes enthoben</dt><dd>${susp.length?`<span style="color:var(--err)">${susp.length}</span>`:0}</dd>
   <dt>vakante Funktionen (davon hD)</dt><dd>${(()=>{const v=S.org.filter(o=>orgStatus(o)==='vakant');return v.length?`<a href="#" data-act="goorg">${v.length} (${v.filter(o=>o.lg==='hD').length})</a>`:0})()}</dd>
   ${isBL()?`<dt>offene Bewerbungen höherer Dienst</dt><dd>${offB}</dd>`:''}
   <dt>Personalmaßnahmen ${y}</dt><dd>${inY.length}</dd>
   <dt>– Einstellungen / Beförderungen</dt><dd>${n('Einstellung')} / ${n('Beförderung')}</dd>
   <dt>– Versetzungen / Zurückstufungen</dt><dd>${n('Versetzung')} / ${n('Zurückstufung')}</dd>
   <dt>– Entlassungen</dt><dd>${n('Entlassung')}</dd>
  </dl></fieldset>
  <fieldset><legend>Wiedervorlagen und Fristen</legend>
   ${wv.length?`<ul class="wv">${wv.slice(0,12).map(w=>`<li><span class="d" style="${w.d<t?'color:var(--err);font-weight:600':w.d===t?'color:var(--warn);font-weight:600':''}">${fmtD(w.d)}</span><a data-act="gowv" data-id="${w.go}|${w.id}">${esc(w.t)}</a></li>`).join('')}</ul>`:'<div style="color:var(--tx3)">Keine Wiedervorlagen fällig.</div>'}
  </fieldset>
  <fieldset><legend>Termine – heute und die nächsten 7 Tage</legend>
   ${(()=>{const L=termineIm(t,addDays(t,7),true);return L.length?`<ul class="wv">${L.slice(0,10).map(o=>`<li><span class="d" style="${o.d===t?'color:var(--warn);font-weight:600':''}">${o.d===t?'heute':WT[new Date(o.d+'T12:00').getDay()]+' '+fmtD(o.d).slice(0,6)}</span><span style="width:84px;flex:none;color:var(--tx2)">${esc(o.n?tagZeit(o):(o.t.ganztag?'ganztägig':(o.t.von||'')))}</span>${pdot(terminPerson(o.t))}<a data-act="termin" data-id="${o.t.id}">${esc(o.t.titel)}</a>${o.t.ort?`<span style="margin-left:auto;color:var(--tx3)">${esc(o.t.ort)}</span>`:''}</li>`).join('')}</ul>`:'<div style="color:var(--tx3)">Keine Termine in den nächsten 7 Tagen.</div>'})()}
  </fieldset>
  <fieldset><legend>Meine offenen Aufgaben</legend>
   ${(()=>{const L=S.todos.filter(x=>!x.erledigt&&betrifftMich(x.zustaendig)).sort((a,b)=>(a.faellig||'9')<(b.faellig||'9')?-1:1);return L.length?`<ul class="wv">${L.slice(0,8).map(x=>`<li><input type="checkbox" data-act="todochk" data-id="${x.id}" style="margin:0"><span class="d" style="${x.faellig&&x.faellig<t?'color:var(--err);font-weight:600':''}">${x.faellig?fmtD(x.faellig):'–'}</span><a data-act="todo" data-id="${x.id}">${esc(x.titel)}</a>${x.prio==='hoch'?'<span class="st err" style="margin-left:auto">hoch</span>':''}</li>`).join('')}</ul>${L.length>8?`<div style="color:var(--tx3)">… und ${L.length-8} weitere</div>`:''}`:'<div style="color:var(--tx3)">Keine offenen Aufgaben.</div>'})()}
  </fieldset>
  <fieldset><legend>Führungskräfte (höherer Dienst)</legend>
   <ul class="wv">${fk.map(p=>`<li><span style="width:58px;flex:none;font-weight:600">${rolleOf(p)?pdot(p.id):''}${esc(p.dg)}</span><span>${esc(p.nachname)}${p.vorname?', '+esc(p.vorname):''}${p.titel?', '+esc(p.titel):''}${p.id===USER.pid?' <span style="color:var(--tx3)">(Sie)</span>':''}</span><span style="margin-left:auto;color:var(--tx2);text-align:right">${rolleOf(p)==='Behördenleitung'?'Behördenleitung':rolleOf(p)==='Leitung Wachbezirk'?esc(wbOf(p.dienststelle)):esc(p.funktion||p.dienststelle)}${p.status!=='aktiv'?' '+statusBadge(p):''}</span></li>`).join('')||'<li style="color:var(--tx3)">Keine Führungskräfte erfasst.</li>'}${fk.length>8?'':''}</ul>
  </fieldset>
  <fieldset><legend>Letzte Personalmaßnahmen</legend>
   ${last.length?`<ul class="wv">${last.map(m=>`<li><span class="d">${fmtD(m.datum)}</span><span>${esc(m.art)}: ${esc(pname(m.pid,1))}${m.nach&&m.art!=='Versetzung'?' → '+esc(m.nach):''}${m.art==='Versetzung'?' → '+esc(m.nach):''}</span><a style="margin-left:auto;white-space:nowrap" data-act="akte" data-id="${m.pid}">Akte</a></li>`).join('')}</ul>`:'<div style="color:var(--tx3)">Noch keine Maßnahmen verfügt.</div>'}
  </fieldset>
  ${isBL()?`<fieldset style="grid-column:1/-1"><legend>Letzte Vorgänge</legend>
   ${grid('cockpitlog',[{l:'Zeitpunkt',f:r=>fmtTs(r.ts)},{l:'Benutzer',f:r=>esc(r.user),mono:1},{l:'Aktion',f:r=>esc(r.aktion)},{l:'Objekt',f:r=>esc(r.objekt)}],S.protokoll.slice(0,8).map((r,i)=>Object.assign({id:'l'+i},r)))}
  </fieldset>`:''}</div>`;

function antragGenehmigen(a){
 if(a.status!=='offen'){toast('Über diesen Antrag wurde bereits entschieden.',true);return}
 const p=person(a.pid);if(!p||p.status==='ausgeschieden'){toast('Die/der Betroffene ist nicht mehr im Bestand.',true);return}
 confirmDlg('Antrag genehmigen',`Antrag <b>${esc(a.az)}</b> genehmigen?<br><br>${esc(a.art)}: ${esc(pname(a.pid,1))} – ${esc(a.summary)}<br>Wirksam ab ${fmtD(a.params.datum)}<br><br>${a.art==='Sonstiger Antrag'?'Die Genehmigung wird dokumentiert; eine Personalmaßnahme wird nicht erzeugt.':'Die Maßnahme wird sofort verfügt.'}`,()=>{
  const pr=a.params;let m;const zus=' (Antrag '+a.az+')';
  if(a.art==='Beförderung'||a.art==='Zurückstufung')m=doBef(a.pid,pr.nach,pr.datum,(pr.text||a.art)+zus);
  else if(a.art==='Versetzung')m=doVers(a.pid,pr.ds,pr.funktion,pr.datum,(pr.text||'')+zus);
  else if(a.art==='Entlassung')m=doEntl(a.pid,pr.grund,pr.datum,pr.text||'');
  else if(a.art==='Vorläufige Dienstenthebung')m=doStatus(a.pid,'suspendiert',pr.datum,(pr.text||'')+zus);
  else if(a.art==='Aufhebung der Dienstenthebung')m=doStatus(a.pid,'aktiv',pr.datum,(pr.text||'')+zus);
  else if(a.art==='Beurlaubung')m=doStatus(a.pid,'beurlaubt',pr.datum,(pr.text||'')+zus);
  a.status='genehmigt';a.entscheidung='genehmigt';a.entschVon=USER.name;a.entschKennung=USER.kennung;a.entschDatum=today();save('antraege');log('Antrag genehmigt',a.az);render();
  if(m)setTimeout(()=>printMassnahme(m),50);
  else setTimeout(()=>printDoc(docAntragBescheid(a),'Bescheid zu Antrag '+a.az),50);
 },'Genehmigen');
}

   `<div class="tw"><table class="grid" style="min-width:0"><thead><tr><th>Datum</th><th>Az.</th><th>Maßnahme</th><th>Von</th><th>Nach</th><th>Bemerkung</th>${isBL()?'<th></th>':''}</tr></thead><tbody>${ms.map(m=>`<tr><td>${fmtD(m.datum)}</td><td class="mono">${esc(m.az)}</td><td>${esc(m.art)}</td><td>${esc(m.von)}</td><td>${esc(m.nach)}</td><td>${esc(m.text)}</td>${isBL()?`<td style="width:56px"><a href="#" data-del="m|${m.id}" style="color:var(--err)">löschen</a></td>`:''}</tr>`).join('')||'<tr class="empty"><td colspan="7">Keine Maßnahmen erfasst.</td></tr>'}</tbody></table></div>`}
  if(cur==='a'){const as=S.antraege.filter(a=>a.pid===id).sort((a,b)=>a.datum<b.datum?1:-1);return `<div class="tw"><table class="grid" style="min-width:0"><thead><tr><th>Az.</th><th>Datum</th><th>Maßnahme</th><th>Inhalt</th><th>Antragsteller/in</th><th>Status</th>${isBL()?'<th></th>':''}</tr></thead><tbody>${as.map(a=>`<tr><td class="mono">${esc(a.az)}</td><td>${fmtD(a.datum)}</td><td>${esc(a.art)}</td><td>${esc(a.summary)}</td><td>${esc(pname(a.von,1))}</td><td>${stBadge(a.status)}</td>${isBL()?`<td style="width:56px"><a href="#" data-del="a|${a.id}" style="color:var(--err)">löschen</a></td>`:''}</tr>`).join('')||'<tr class="empty"><td colspan="7">Keine Anträge.</td></tr>'}</tbody></table></div>`}

  if(cur==='v')return `${edit?`<div class="form" style="grid-template-columns:1fr auto;margin-bottom:8px"><textarea id="vTx" rows="2" placeholder="Aktenvermerk erfassen …"></textarea><button class="btn" id="vAdd" style="align-self:start">Vermerk hinzufügen</button></div>`:''}
   <ul class="wv">${p.vermerke.map((v,i)=>[v,i]).reverse().map(([v,i])=>`<li><span class="d">${fmtD(v.datum)}</span><span style="white-space:pre-wrap;flex:1">${esc(v.text)}</span><span style="color:var(--tx3)">${esc(v.von)}</span>${isBL()?`<a href="#" data-del="v|${i}" style="color:var(--err);margin-left:10px">löschen</a>`:''}</li>`).join('')||'<li style="color:var(--tx3)">Keine Vermerke.</li>'}</ul>`;
 };
 const dlg=openDlg({title:`Personalakte – ${p.dg} ${p.nachname}, ${p.vorname} (DNr. ${p.dnr})`,size:'wide',
  body:`<div class="tabs">${tabs.map(t=>`<button data-tab="${t[0]}">${t[1]}</button>`).join('')}</div><div class="tabp" id="akteBody"></div>`,
  left:[{label:'Personalbogen drucken',close:false,fn:()=>printDoc(docPersonalbogen(p),'Personalbogen')},...(isBL()?[{label:'Nacherfassen …',fn:()=>{setTimeout(()=>nacherfassen(id),10)}}]:[]),...(edit?[{label:'Status ändern …',fn:()=>{setTimeout(()=>statusAendern(id),10)}},...(isBL()?[{label:'Befördern (hD) …',fn:()=>{setTimeout(()=>befoerdern(id),10)}}]:[]),{label:'Antrag stellen …',fn:()=>{setTimeout(()=>antragNeu(id),10)}}]:[])],
  buttons:[...(edit?[{label:'Speichern',pri:true,fn:a=>{if(cur!=='st'){render();return}const v=readForm(a,F);if(!v)return false;delete v.status;if(!isBL())delete v.dnr;else if(v.dnr!==p.dnr&&S.personal.some(x=>x!==p&&x.dnr===v.dnr)){toast('Die Dienstnummer '+v.dnr+' ist bereits vergeben.',true);return false}
    if(v.dg!==p.dg&&!isBL()&&isHD(v.dg)){toast('Ämter des höheren Dienstes vergibt die Behördenleitung (Befördern hD).',true);return false}
    if(v.dienststelle!==p.dienststelle&&!isBL()&&!myDST().includes(v.dienststelle)){toast('Dienststellen außerhalb Ihres Wachbezirks: bitte Versetzung beantragen.',true);return false}
    if(p.id===USER.pid&&(v.dg!==p.dg||v.dienststelle!==p.dienststelle)){toast('Das eigene Amt und die eigene Dienststelle ändert eine andere Person der Behördenleitung.',true);return false}
    const aend=[];if(v.dg!==p.dg)aend.push('Amt '+p.dg+' → '+v.dg);if(v.dienststelle!==p.dienststelle)aend.push('Dienststelle '+p.dienststelle+' → '+v.dienststelle);
    const warZugang=!!rolleOf(p);
    Object.assign(p,v);save('personal');log('Personalakte geändert',p.dnr+' '+p.nachname+(aend.length?' ('+aend.join(', ')+')':''));render();toast('Personalakte gespeichert.'+(aend.length?' '+aend.join(', '):''));
    if(!warZugang&&rolleOf(p)&&isBL())setTimeout(()=>zugangAnbieten(p),400)}}]:[]),{label:'Schließen'}]});
 const show=()=>{dlg.qa('[data-tab]').forEach(b=>b.classList.toggle('act',b.dataset.tab===cur));dlg.q('#akteBody').innerHTML=body();
  const qa=dlg.q('#qAdd');if(qa)qa.onclick=()=>{const q=dlg.q('#qSel').value;if(!q)return;p.quals.push({q,datum:dlg.q('#qDat').value||today()});save('personal');log('Qualifikation erfasst',p.nachname+': '+q);show()};
  dlg.qa('[data-qdel]').forEach(e=>e.onclick=ev=>{ev.preventDefault();const q=p.quals.splice(+e.dataset.qdel,1)[0];save('personal');log('Qualifikation entfernt',p.nachname+': '+q.q);show()});

  dlg.qa('[data-del]').forEach(e=>e.onclick=ev=>{ev.preventDefault();if(!needBL())return;const [typ,key]=e.dataset.del.split('|');
   let txt='',fn=null;
   if(typ==='m'){const m=S.massnahmen.find(x=>x.id===key);if(!m)return;txt=`Personalmaßnahme <b>${esc(m.art)}</b> vom ${fmtD(m.datum)} (${esc(m.az)}) aus der Akte löschen?<br><br>Amt, Dienststelle und Status der Person bleiben unverändert.`;fn=()=>{S.massnahmen=S.massnahmen.filter(x=>x.id!==key);save('massnahmen');log('Personalmaßnahme gelöscht',p.nachname+': '+m.art+' '+m.az)}}
   if(typ==='d'){const d=S.disziplinar.find(x=>x.id===key);if(!d)return;txt=`Disziplinarvorgang <b>${esc(d.az)}</b> (${esc(d.status)}) löschen?`;fn=()=>{S.disziplinar=S.disziplinar.filter(x=>x.id!==key);save('disziplinar');log('Disziplinarvorgang gelöscht',p.nachname+': '+d.az)}}
   if(typ==='a'){const a=S.antraege.find(x=>x.id===key);if(!a)return;txt=`Antrag <b>${esc(a.az)}</b> (${esc(a.art)}, ${esc(a.status)}) löschen?`;fn=()=>{S.antraege=S.antraege.filter(x=>x.id!==key);save('antraege');log('Antrag gelöscht',p.nachname+': '+a.az)}}
   if(typ==='v'){const v=p.vermerke[+key];if(!v)return;txt=`Aktenvermerk vom ${fmtD(v.datum)} löschen?<br><br><i>${esc(String(v.text).slice(0,160))}</i>`;fn=()=>{p.vermerke.splice(+key,1);save('personal');log('Aktenvermerk gelöscht',p.nachname)}}
   if(fn)confirmDlg('Eintrag löschen',txt,()=>{fn();show();render()},'Löschen')});
 };
 dlg.qa('[data-tab]').forEach(b=>b.onclick=()=>{cur=b.dataset.tab;show()});show();
}

/* --- Personalmaßnahmen: Ausführung --- */
function doBef(pid,nach,datum,text){const p=person(pid);const down=rankIdx(nach)<rankIdx(p.dg);const warZugang=!!rolleOf(p);
 const m={id:uid(),az:AZ.P(),art:down?'Zurückstufung':'Beförderung',pid,von:p.dg,nach,datum,text:text||(down?'Zurückstufung':'Beförderung'),user:USER.kennung};
 S.massnahmen.push(m);p.dg=nach;p.befoerdert=datum;save('personal','massnahmen');log(m.art,p.dnr+' '+p.nachname+': '+m.von+' → '+m.nach+' ('+m.az+')');render();toast(m.art+' verfügt: '+p.nachname+' → '+nach);
 if(!warZugang&&rolleOf(p)&&isBL())setTimeout(()=>zugangAnbieten(p),900);
 return m}
function doVers(pid,ds,funktion,datum,text){const p=person(pid);
 const m={id:uid(),az:AZ.P(),art:'Versetzung',pid,von:p.dienststelle,nach:ds,datum,text:(text||'')+(funktion?' – Verwendung: '+funktion:''),user:USER.kennung};
 S.massnahmen.push(m);p.dienststelle=ds;if(funktion)p.funktion=funktion;save('personal','massnahmen');log('Versetzung',p.nachname+': '+m.von+' → '+m.nach);render();return m}
function doStatus(pid,status,datum,text,bis){const p=person(pid);
 const art={beurlaubt:'Beurlaubung','im Urlaub':'Urlaub',abgemeldet:'Abmeldung vom Dienst',suspendiert:'Vorläufige Dienstenthebung',aktiv:p.status==='suspendiert'?'Wiederaufnahme des Dienstes':'Rückmeldung zum Dienst','krank gemeldet':'Krankmeldung'}[status]||'Statusänderung';
 const m={id:uid(),az:AZ.P(),art,pid,von:p.status,nach:status,datum,text:(text||art)+(bis&&status!=='aktiv'?' (voraussichtlich bis '+fmtD(bis)+')':''),user:USER.kennung};S.massnahmen.push(m);
 p.status=status;p.statusAb=datum;p.statusBis=status!=='aktiv'&&bis?bis:'';
 save('personal','massnahmen');log(art,p.nachname+(p.statusBis?' bis '+fmtD(p.statusBis):''));render();return m}
function doEntl(pid,grund,datum,text){const p=person(pid);
 const m={id:uid(),az:AZ.P(),art:'Entlassung',pid,von:p.dg,nach:'',datum,text:grund+(text?' – '+text:''),grund,begr:text,user:USER.kennung};
 S.massnahmen.push(m);p.status='ausgeschieden';p.austritt=datum;p.austrittGrund=grund;save('personal','massnahmen');log('Entlassung',p.dnr+' '+p.nachname+' – '+grund);render();return m}

/* Zurückliegende Beförderung nacherfassen (Behördenleitung) – alle Ämter, beliebiges Datum */
function nacherfassen(id){
 if(!needBL())return;const p=person(id);if(!p)return;
 const bl=S.personal.filter(x=>rolleOf(x)==='Behördenleitung'&&x.status!=='ausgeschieden');
 const F=[{k:'von',l:'Bisheriges Amt',t:'select',o:()=>rankOpts(R()),empty:'(unbekannt / Einstellung)'},{k:'nach',l:'Neues Amt',t:'select',req:1,o:()=>rankOpts(R())},
  {k:'datum',l:'Beförderung am',t:'date',req:1},{k:'az',l:'Aktenzeichen',ph:'leer = wird vergeben'},
  {k:'user',l:'Unterzeichnet von',t:'select',o:()=>bl.map(x=>({v:x.nachname.toUpperCase(),l:x.dg+' '+[x.titel,x.vorname,x.nachname].filter(Boolean).join(' ')})),empty:'(nicht bekannt)'},
  {k:'text',l:'Bemerkung',def:'Beförderung (Nacherfassung)'}];
 const iP=rankIdx(p.dg);
 openDlg({title:'Beförderung nacherfassen – '+p.dg+' '+p.nachname,body:`<div class="hint info">Für Beförderungen, die vor der Einführung von BeLIS oder außerhalb von BeLIS ausgesprochen wurden. Der Eintrag erscheint im Werdegang und im Personalbogen; eine Urkunde kann anschließend erstellt werden.</div>`+formHtml(F,{von:(R()[iP-1]||{}).k||'',nach:p.dg,datum:p.befoerdert||today(),user:USER.kennung,text:'Beförderung (Nacherfassung)'})+
  '<div class="form" style="margin-top:6px"><label>Aktuelles Amt</label><label style="text-align:left"><input type="checkbox" id="naAmt"> Amt und „Letzte Beförderung“ der Person auf diesen Stand setzen</label><label>Urkunde</label><label style="text-align:left"><input type="checkbox" id="naUrk"> Urkunde anzeigen</label></div>',
  onOpen:a=>{const u=()=>{const n=a.q('#f_nach').value,d=a.q('#f_datum').value;a.q('#naAmt').checked=n!==p.dg&&(!p.befoerdert||d>=p.befoerdert)};a.q('#f_nach').onchange=u;a.q('#f_datum').onchange=u;u()},
  buttons:[{label:'Nacherfassen',pri:true,fn:a=>{const v=readForm(a,F);if(!v)return false;
   if(v.von&&v.von===v.nach){toast('Bisheriges und neues Amt sind gleich.',true);return false}
   if(v.datum>today()){toast('Eine Nacherfassung kann nicht in der Zukunft liegen.',true);return false}
   if(v.az&&S.massnahmen.some(m=>m.az===v.az)){toast('Das Aktenzeichen '+v.az+' ist bereits vergeben.',true);return false}
   const m={id:uid(),az:v.az||AZ.P(),art:'Beförderung',pid:p.id,von:v.von||'',nach:v.nach,datum:v.datum,text:v.text||'Beförderung (Nacherfassung)',user:v.user||'',nacherfasst:true,erfasstVon:USER.kennung,erfasstAm:new Date().toISOString()};
   S.massnahmen.push(m);S.massnahmen.sort((x,y)=>x.datum<y.datum?-1:x.datum>y.datum?1:0);
   const warZugang=!!rolleOf(p);
   if(a.q('#naAmt').checked){p.dg=v.nach;p.befoerdert=v.datum;save('personal')}
   save('massnahmen');log('Beförderung nacherfasst',p.dnr+' '+p.nachname+': '+(m.von||'?')+' → '+m.nach+' ('+fmtD(m.datum)+', '+m.az+')');render();
   toast('Nacherfasst: '+p.nachname+' → '+m.nach+' am '+fmtD(m.datum));
   if(a.q('#naUrk').checked)setTimeout(()=>printMassnahme(m),60);
   else if(!warZugang&&rolleOf(p))setTimeout(()=>zugangAnbieten(p),400)}},{label:'Abbrechen'}]});
}
function befoerdern(id){
 if(!needScope(id))return;
 const p=person(id);const ziele=befZiele().filter(r=>rankIdx(r.k)>rankIdx(p.dg));
 if(p.id===USER.pid){toast('Eigene Personalmaßnahmen können nicht selbst verfügt werden.',true);return}
 if(!isBL()){toast('Beförderungen verfügt die Behördenleitung. Bitte einen Antrag stellen.');setTimeout(()=>antragNeu(id,'Beförderung'),10);return}
 if(!ziele.length){toast('Für '+p.dg+' ist keine Beförderung im höheren Dienst mehr möglich.',true);return}
 const warn=[];const sz=stehzeit(p);
 if(p.status!=='aktiv')warn.push(['err',`Bedienstete/r ist nicht im aktiven Dienst (Status: ${p.status}).`]);
 if(openDisz(id).length)warn.push(['err',`Beförderungssperre: Laufendes Disziplinarverfahren ${openDisz(id).map(d=>d.az).join(', ')}.`]);
 if(sz!=null&&sz<(+S.meta.mindeststehzeit||0))warn.push(['warn',`Mindeststehzeit nicht erreicht: ${sz} von ${S.meta.mindeststehzeit} Tagen.`]);
 const orgF=S.org.filter(o=>o.inhaber&&o.inhaber.toLowerCase().includes(p.nachname.toLowerCase()));
 const F=[{k:'nach',l:'Neues Amt (höherer Dienst)',t:'select',req:1,o:rankOpts(ziele)},{k:'datum',l:'Wirksam ab',t:'date',req:1},{k:'text',l:'Begründung',t:'textarea',rows:3}];
 openDlg({title:'Personalmaßnahme – Beförderung im höheren Dienst',
  body:`${warn.map(w=>`<div class="hint ${w[0]}">${esc(w[1])}</div>`).join('')}<dl class="kv" style="margin-bottom:10px"><dt>Bedienstete/r</dt><dd><b>${esc(p.nachname)}, ${esc(p.vorname)}</b> (DNr. ${esc(p.dnr)})</dd><dt>Derzeitiges Amt</dt><dd>${esc(rank(p.dg).n)} (${esc(p.dg)}), ${esc(rank(p.dg).bes)}</dd><dt>Dienststelle</dt><dd>${esc(p.dienststelle)}</dd><dt>Funktion laut Organisationsplan</dt><dd>${orgF.length?orgF.map(o=>esc(o.funktion)+' ('+o.lg+')').join('<br>'):'<span style="color:var(--tx3)">keine zugeordnet</span>'}</dd><dt>Stehzeit</dt><dd>${sz??'–'} Tage</dd></dl>`+formHtml(F,{nach:ziele[0].k,datum:today()})+
  '<div class="form" style="margin-top:6px"><label>Urkunde</label><label style="text-align:left"><input type="checkbox" id="mkUrk" checked> Ernennungsurkunde erstellen</label></div><div id="lgHint" style="margin-top:8px"></div>',
  onOpen:a=>{const upd=()=>{const o=rank(p.dg);a.q('#lgHint').innerHTML=o.lg!=='hD'?`<div class="hint info">Aufstieg ${esc(o.lg||'')} → hD. Nachweis der Aufstiegsqualifikation bzw. des Auswahlverfahrens zur Akte nehmen.</div>`:''};upd()},
  buttons:[{label:'Beförderung verfügen',pri:true,fn:a=>{const v=readForm(a,F);if(!v)return false;
   const m=doBef(id,v.nach,v.datum,v.text);if(a.q('#mkUrk').checked)setTimeout(()=>printMassnahme(m),50)}},{label:'Abbrechen'}]});
}
function versetzen(id){
 if(!needScope(id))return;
 const p=person(id);const F=[{k:'dienststelle',l:'Neue Dienststelle',t:'select',req:1,o:DST},{k:'funktion',l:'Neue Funktion'},{k:'datum',l:'Wirksam ab',t:'date',req:1},{k:'text',l:'Begründung',t:'textarea',rows:3,def:'aus dienstlichen Gründen'}];
 const needA=ds=>!isBL()&&wbOf(ds)!==myWB();
 openDlg({title:'Personalmaßnahme – Versetzung / Umsetzung',body:`${antragDlgHint()}<dl class="kv" style="margin-bottom:10px"><dt>Bedienstete/r</dt><dd><b>${esc(p.dg)} ${esc(p.nachname)}, ${esc(p.vorname)}</b></dd><dt>Bisherige Dienststelle</dt><dd>${esc(p.dienststelle)} (${esc(wbOf(p.dienststelle))}) – ${esc(p.funktion)}</dd></dl>`+formHtml(F,{dienststelle:p.dienststelle,funktion:p.funktion,datum:today()})+(isBL()?'':'<div style="color:var(--tx3);margin-top:6px">Umsetzungen innerhalb Ihres Wachbezirks verfügen Sie selbst; Versetzungen in andere Bereiche nur auf Antrag.</div>'),
  onOpen:a=>{const u=()=>{const na=needA(a.q('#f_dienststelle').value);const h=a.q('#antrHint');if(h)h.style.display=na?'':'none';const b=[...a.el.querySelectorAll('.df .btn.pri')].pop();if(b)b.textContent=na?'Antrag stellen':'Versetzung verfügen'};a.q('#f_dienststelle').onchange=u;u()},
  buttons:[{label:'Versetzung verfügen',pri:true,fn:a=>{const v=readForm(a,F);if(!v)return false;if(v.dienststelle===p.dienststelle&&v.funktion===p.funktion){toast('Keine Änderung angegeben.',true);return false}
   if(needA(v.dienststelle)){stelleAntrag('Versetzung',id,{ds:v.dienststelle,funktion:v.funktion,datum:v.datum,text:v.text},p.dienststelle+' → '+v.dienststelle,v.text);return}
   const m=doVers(id,v.dienststelle,v.funktion,v.datum,v.text);setTimeout(()=>printMassnahme(m),50)}},{label:'Abbrechen'}]});
}
function statusAendern(id){
 if(!needScope(id))return;
 if(id===USER.pid){toast('Den eigenen Dienststatus kann nur eine andere Person der Behördenleitung ändern.',true);return}
 const p=person(id);
 if(p.status==='ausgeschieden'&&!isBL()){toast('Die Wiederaufnahme ausgeschiedener Personen ist der Behördenleitung vorbehalten.',true);return}

const TITEL_RE=/^((?:Prof\.\s*)?(?:Dr\.(?:\s*(?:jur|iur|med|rer\.\s*nat|phil)\.)?)?)\s*/i;
const nNorm=s=>String(s||'').toLowerCase().replace(TITEL_RE,'').replace(/\s+/g,' ').trim();
function zerlegeName(n){const m=String(n).trim().match(TITEL_RE);const titel=(m&&m[1]||'').trim();const t=String(n).trim().slice(m?m[0].length:0).split(/\s+/).filter(Boolean);
 if(t.length<2)return{titel,vorname:'',nachname:t[0]||''};let k=t.length-1;if(k>1&&/^(von|van|de|zu|vom|der)$/i.test(t[k-1]))k--;return{titel,vorname:t.slice(0,k).join(' '),nachname:t.slice(k).join(' ')}}
function personZuName(n){const z=zerlegeName(n);const nn=z.nachname.toLowerCase(),vn=z.vorname.toLowerCase().replace(/\.$/,'');
 return S.personal.find(p=>p.status!=='ausgeschieden'&&String(p.nachname).toLowerCase()===nn&&(!vn||String(p.vorname||'').toLowerCase().startsWith(vn)))}
function orgOffen(){const L=[];(S.org||[]).forEach(o=>String(o.inhaber||'').split(/\s*(?:&|,|\/|\bund\b)\s*/).map(x=>x.trim()).filter(Boolean).forEach((n,i)=>{

 }

   }}},
  {l:'Absage',ic:'del',sel:1,fn:id=>{const b=S.bewerbungen.find(x=>x.id===id);confirmDlg('Absage erteilen',`Bewerbung ${esc(b.az)} ablehnen und Absageschreiben erstellen?`,()=>{b.status='Absage';save('bewerbungen');log('Absage erteilt',b.az);render();setTimeout(()=>printDoc(docBewerberbrief(b),'Absageschreiben'),50)},'Absage erteilen')}}]

/* ================= Disziplinarwesen ================= */
const DSTAT=['eingeleitet','Ermittlung','Anhörung','ausgesetzt','abgeschlossen','eingestellt'];

V.disziplinar={t:'Disziplinarverfahren',count:()=>S.disziplinar.filter(d=>inScope(d.pid)&&!['abgeschlossen','eingestellt'].includes(d.status)).length||'',warn:()=>S.disziplinar.some(d=>d.frist&&d.frist<today()&&!['abgeschlossen','eingestellt'].includes(d.status)),
 neuLabel:'Verfahren einleiten',
 F:()=>[{k:'az',l:'Aktenzeichen',ro:1},{k:'pid',l:'Betroffene/r',t:'select',req:1,o:()=>scopePersons().filter(p=>p.status!=='ausgeschieden'&&p.id!==USER.pid).sort((a,b)=>a.nachname.localeCompare(b.nachname)).map(p=>({v:p.id,l:p.nachname+', '+p.vorname+' ('+p.dg+', DNr. '+p.dnr+')'})),empty:'(auswählen)'},
  {k:'eingeleitet',l:'Eingeleitet am',t:'date',req:1},{k:'vorwurf',l:'Vorwurf / Sachverhalt',t:'textarea',req:1,rows:4},{k:'kurzfassung',l:'Kurzfassung (Personalakte)',t:'textarea',rows:2,ph:'z. B. Unerlaubte Sonderrechtsfahrt – Verweis'},{k:'ermittler',l:'Ermittlungsführer/in',req:1},

 render(){const st=fil('st','offen');

  grid('disziplinar',[{l:'Aktenzeichen',f:r=>esc(r.az),mono:1},{l:'Eingeleitet',f:r=>fmtD(r.eingeleitet),s:r=>r.eingeleitet},{l:'Betroffene/r',f:r=>esc(pname(r.pid,1))},{l:'Vorwurf (Kurzfassung)',f:r=>esc(r.kurzfassung||r.vorwurf)},{l:'Akte',f:r=>(r.akte||[]).filter(e=>e.typ!=='Verfahrensschritt').length+' Bl.',num:1,s:r=>(r.akte||[]).length},{l:'Ermittlung',f:r=>esc(r.ermittler)},{l:'Stand',f:r=>stBadge(r.status)},{l:'Frist',f:r=>r.frist?`<span style="${r.frist<today()&&!['abgeschlossen','eingestellt'].includes(r.status)?'color:var(--err);font-weight:600':''}">${fmtD(r.frist)}</span>`:''},{l:'Maßnahme',f:r=>esc(r.massnahme)}],rows,'Keine Verfahren in diesem Stand.')},
 neu(pid){if(!needEdit())return;if(!pid){pickPerson('Disziplinarverfahren einleiten',id=>V.disziplinar.neu(id));return}const F=this.F();openDlg({title:'Disziplinarverfahren einleiten',body:'<div class="hint info">Die/der Betroffene ist über die Einleitung zu unterrichten und auf das Recht zur Äußerung hinzuweisen. Die Einleitungsverfügung wird nach Speicherung angezeigt.</div>'+formHtml(F,{az:'(wird vergeben)',pid:pid||'',eingeleitet:today(),status:'eingeleitet',frist:addDays(today(),14),ermittler:USER.name}),

/* ================= Disziplinarakte ================= */
const AKTEN_TYPEN=['Zeugenaussage','Stellungnahme der/des Betroffenen','Anhörungsprotokoll','Beweismittel','Ermittlungsvermerk','Schriftverkehr','Sonstiges'];
const AKT_FARBE={'Zeugenaussage':'info','Stellungnahme der/des Betroffenen':'warn','Anhörungsprotokoll':'warn','Beweismittel':'ok','Ermittlungsvermerk':'n','Schriftverkehr':'n','Sonstiges':'n','Verfahrensschritt':'n'};
function diszEintrag(d,typ,titel,inhalt,extra){d.akte=d.akte||[];d.akte.push(Object.assign({id:uid(),typ,datum:today(),zeit:new Date().toTimeString().slice(0,5),titel,inhalt:inhalt||'',beteiligt:'',anlage:'',von:USER?USER.kennung:'SYSTEM',am:new Date().toISOString()},extra||{}))}
const sortAkte=d=>(d.akte||[]).slice().sort((a,b)=>(a.datum+(a.zeit||''))<(b.datum+(b.zeit||''))?-1:(a.datum+(a.zeit||''))>(b.datum+(b.zeit||''))?1:(a.am<b.am?-1:1));
function disziplinarakte(id,tab){
 const d=S.disziplinar.find(x=>x.id===id);if(!d)return;d.akte=d.akte||[];
 const darf=inScope(d.pid);const done=DISZ_ZU.includes(d.status);const F=V.disziplinar.F();
 let cur=tab||'ue';const p=person(d.pid)||{};
 const tabs=[['ue','Verfahren'],['ak','Aktenverlauf ('+d.akte.filter(e=>e.typ!=='Verfahrensschritt').length+')'],['en','Entscheidung']];
 const body=()=>{
  if(cur==='ue')return (done?`<div class="hint info">Verfahren ${esc(d.status)} am ${fmtD(d.abschluss)} – Entscheidung: ${esc(d.massnahme||'–')}</div>`:'')+formHtml(darf?F:F.map(f=>Object.assign({},f,{ro:1})),d)+`<div style="color:var(--tx3);margin-top:6px">Die <b>Kurzfassung</b> erscheint in der Personalakte und im Personalbogen. Zeugenaussagen, Stellungnahmen und Beweismittel werden im <b>Aktenverlauf</b> geführt.</div>`;
  if(cur==='ak'){const L=sortAkte(d);let n=0;

async function kennwortZuruecksetzen(p){
 if(!needBL())return;
 if(p.id===USER.pid){toast('Das eigene Kennwort ändern Sie über Datei › Kennwort ändern.',true);return}
 const std=S.meta.stdPw||'';const mail=kennungMail(p);
 if(!hatKonto(p)){toast('Für diese Person ist noch kein Konto angelegt – bitte „Zugang anlegen“.',true);return}
 if(std.length<6){toast('Bitte zuerst unter Stammdaten ein Standardkennwort (mind. 6 Zeichen) festlegen.',true);return}
 confirmDlg('Kennwort zurücksetzen',`Das Kennwort von <b>${esc(p.dg)} ${esc(p.nachname)}</b> wird auf das Standardkennwort <b>${esc(std)}</b> gesetzt. Bei der nächsten Anmeldung muss ein neues Kennwort festgelegt werden.`,async()=>{
  let ok=false,neu=false,err='';
  try{const fn=firebase.app().functions('europe-west3').httpsCallable('kennwortZuruecksetzen');const r=await fn({email:mail});ok=!!(r&&r.data&&r.data.ok);neu=!!(r&&r.data&&r.data.neu)}
  catch(e){err=(e&&(e.code||'')+' '+(e.message||''))||String(e)}
  p.acc=Object.assign(p.acc||{},{must:true,gesperrt:false});save('personal');
  if(ok){log('Kennwort zurückgesetzt',p.nachname+(neu?' (Konto neu angelegt)':''));render();
   infoDlg('Kennwort zurückgesetzt',`<p style="margin-top:0">${neu?'Das Konto wurde angelegt.':'Das Kennwort wurde zurückgesetzt.'}</p><dl class="kv"><dt>Nachname</dt><dd><b>${esc(p.nachname)}</b></dd><dt>Kennwort</dt><dd><b style="font-family:Consolas,monospace;user-select:all">${esc(std)}</b></dd></dl><p>Bei der Anmeldung wird ${p.anrede==='Frau'?'sie':'er'} aufgefordert, ein eigenes Kennwort festzulegen.</p>`);return}
  if(/permission-denied/.test(err)){toast('Zurücksetzen abgelehnt: '+err.replace(/^\S+\s/,''),true);return}
  log('Kennwortwechsel verlangt',p.nachname+' (Zurücksetzen über Konsole)');render();
  openDlg({title:'Kennwort zurücksetzen – über die Firebase-Konsole',body:`<div class="hint info">Das automatische Zurücksetzen ist nicht eingerichtet (Cloud Function „kennwortZuruecksetzen“ nicht erreichbar). So geht es von Hand – Dauer etwa eine Minute:</div>

 },'Zurücksetzen');

function firestoreRules(){
 const bl=S.personal.filter(p=>rolleOf(p)==='Behördenleitung'&&p.status!=='ausgeschieden').map(kennungMail);
 return `rules_version = '2';
// BeLIS – Zugriffsregeln (erzeugt am ${fmtD(today())})
// Wer zugreifen darf, steht in der Zugriffsliste "zugang/liste". BeLIS pflegt sie automatisch
// aus den Personalakten (Ämter mit Zugang, nicht gesperrt/suspendiert/ausgeschieden).
// Die Gründungskonten der Behördenleitung haben immer Zugriff, damit die Liste angelegt werden kann.
service cloud.firestore {
  match /databases/{database}/documents {
    function gruendung() {
      return request.auth.token.email in [
${bl.map(m=>"        '"+m+"'").join(',\n')}
      ];
    }
    function liste() {
      return get(/databases/$(database)/documents/zugang/liste).data;
    }
    function hatListe() {
      return exists(/databases/$(database)/documents/zugang/liste);
    }
    function berechtigt() {
      return request.auth != null
        && (gruendung() || (hatListe() && request.auth.token.email in liste().alle));
    }
    function behoerdenleitung() {
      return request.auth != null
        && (gruendung() || (hatListe() && request.auth.token.email in liste().bl));
    }
    match /belis/{dok} {
      allow read, write: if berechtigt();
    }
    match /zugang/liste {
      allow read: if berechtigt();
      allow write: if behoerdenleitung();
    }
    // Löschliste: Konten gelöschter Personen (darf jedes angemeldete Konto lesen,
    // damit sich ein gelöschtes Konto beim nächsten Anmeldeversuch selbst entfernt)
    match /zugang/geloescht {
      allow read: if request.auth != null;
      allow write: if behoerdenleitung();
    }
    match /{rest=**} {
      allow read, write: if false;
    }
  }
}
`}

/* Einzeltermine eines (ggf. wiederkehrenden) Termins im Zeitraum */
function terminTage(t,von,bis){
 const out=[];if(!t.datum)return out;
 const ende=t.wdh&&t.wdh!=='keine'?(t.wdhBis&&t.wdhBis<bis?t.wdhBis:bis):t.datum;
 let d=t.datum,i=0;
 while(d<=ende&&i<500){if(d>=von&&d<=bis&&!(t.ausnahmen||[]).includes(d))out.push(d);
  if(!t.wdh||t.wdh==='keine')break;
  if(t.wdh==='wöchentlich')d=addDays(d,7);
  else if(t.wdh==='zweiwöchentlich')d=addDays(d,14);
  else{const x=new Date(t.datum+'T12:00');x.setMonth(x.getMonth()+i+1);if(x.getDate()!==+t.datum.slice(8))x.setDate(0);d=isoDate(x)}
  i++}
 return out;
}

   h+='</tr>'}

  printDoc(docListe('Terminübersicht '+MONATE[KAL.m]+' '+KAL.y,S.meta.behoerde+' · Stand: '+fmtD(today()),['Datum','Zeit','Termin','Art','Ort','Teilnehmende'],L.map(o=>[WT[new Date(o.st+'T12:00').getDay()]+', '+fmtD(o.st)+(o.n?' – '+fmtD(addDays(o.st,o.n)):''),o.n?(o.t.ganztag?'ganztägig':(o.t.von||'')+'–'+(o.t.bis||'')):zeitTxt(o.t),o.t.titel,o.t.kat||'',o.t.ort||'',(o.t.teilnehmer||['alle']).map(kurzName).join(', ')])),'Terminübersicht')}
};
ACT.termin=id=>terminDlg(id);
function terminDlg(id,datum){

  {t:'sep',l:'Zeitraum'},{k:'datum',l:'Datum von',t:'date',req:1},{k:'datumBis',l:'Datum bis',t:'date',req:1},
  {k:'ganztag',l:'Ganztägig',t:'select',o:[{v:'',l:'nein'},{v:'1',l:'ja'}]},{k:'von',l:'Uhrzeit von',t:'time'},{k:'bis',l:'Uhrzeit bis',t:'time'},
  {t:'sep',l:'Weitere Angaben'},{k:'ort',l:'Ort',ph:'z. B. Sitzungssaal Präsidium, Discord'},
  {k:'wdh',l:'Wiederholung',t:'select',o:['keine','wöchentlich','zweiwöchentlich','monatlich']},{k:'wdhBis',l:'Wiederholen bis',t:'date'},{k:'notiz',l:'Beschreibung',t:'textarea',rows:4}];
 const o=t?Object.assign({},t,{ganztag:t.ganztag?'1':'',datumBis:t.datumBis||t.datum}):{datum:datum||today(),datumBis:datum||today(),kat:'Dienstbesprechung',von:'20:00',bis:'21:00',wdh:'keine'};
 const darf=!t||isBL()||t.von_pid===USER.pid;
 openDlg({title:t?'Termin – '+t.titel:'Neuer Termin',body:formHtml(F,o)+teilnehmerHtml(t?t.teilnehmer:['alle'])+(t?`<div style="color:var(--tx3);margin-top:8px">Angelegt von ${esc(kurzName(t.von_pid))} am ${fmtTs(t.erstellt)}${t.wdh&&t.wdh!=='keine'?' · Änderungen gelten für die gesamte Serie.':''}</div>`:''),
  onOpen:a=>{const g=()=>{const gt=a.q('#f_ganztag').value==='1';['von','bis'].forEach(k=>a.q('#f_'+k).disabled=gt)};a.q('#f_ganztag').onchange=g;g();
   let alt=a.q('#f_datum').value;a.q('#f_datum').onchange=()=>{const d=a.q('#f_datum').value,b=a.q('#f_datumBis');if(!b.value||b.value===alt||b.value<d)b.value=d;alt=d}},
  left:t&&darf?[{label:t.wdh&&t.wdh!=='keine'?'Serie löschen':'Löschen',fn:()=>{setTimeout(()=>confirmDlg('Termin löschen',`Termin „${esc(t.titel)}“${t.wdh&&t.wdh!=='keine'?' (gesamte Serie)':''} löschen?`,()=>{S.termine=S.termine.filter(x=>x.id!==t.id);save('termine');log('Termin gelöscht',t.titel);render()},'Löschen'),10)}},
   ...(t.wdh&&t.wdh!=='keine'&&datum?[]:[])]:[],
  buttons:[{label:'Speichern',pri:true,fn:a=>{const v=readForm(a,F);if(!v)return false;v.ganztag=v.ganztag==='1';
    if(!v.datumBis||v.datumBis<v.datum){toast('„Datum bis“ liegt vor „Datum von“.',true);a.q('#f_datumBis').classList.add('bad');return false}

 count:()=>{const n=S.todos.filter(x=>!x.erledigt&&betrifftMich(x.zustaendig)).length;return n||''},warn:()=>S.todos.some(x=>!x.erledigt&&x.faellig&&x.faellig<today()&&betrifftMich(x.zustaendig)),

  const rows=S.todos.filter(x=>a==='alle'?!x.erledigt:a==='erledigt'?x.erledigt:a==='gesamt'?true:(!x.erledigt&&betrifftMich(x.zustaendig)));

   {l:'Fällig',f:r=>r.faellig?`<span style="${!r.erledigt&&r.faellig<t0?'color:var(--err);font-weight:600':!r.erledigt&&r.faellig===t0?'color:var(--warn);font-weight:600':''}">${fmtD(r.faellig)}</span>`:'',s:r=>r.faellig||'9999'},
   {l:'Priorität',f:r=>`<span class="st ${PRIO[r.prio]||'n'}">${esc(r.prio||'normal')}</span>`,s:r=>({hoch:0,normal:1,niedrig:2})[r.prio]??1},

   {l:'Erledigt',f:r=>r.erledigt?fmtD(r.erledigtAm)+(r.erledigtVon?' ('+esc(kurzName(r.erledigtVon))+')':''):''}],rows,a==='meine'?'Keine offenen Aufgaben. 👍':'Keine Aufgaben.')},
 after(){document.querySelectorAll('#vBody [data-tchk]').forEach(c=>{c.onclick=e=>e.stopPropagation();c.onchange=()=>todoToggle(c.dataset.tchk)})},
 neu(){todoDlg()},

 del(id){const x=S.todos.find(y=>y.id===id);if(!isBL()&&x.von_pid!==USER.pid){toast('Nur die anlegende Person oder die Behördenleitung kann löschen.',true);return}confirmDlg('Aufgabe löschen',`Aufgabe „${esc(x.titel)}“ löschen?`,()=>{S.todos=S.todos.filter(y=>y.id!==id);delete SEL.todo;save('todos');log('Aufgabe gelöscht',x.titel);render()},'Löschen')},
 extra:[{l:'Erledigt',ic:'check',sel:1,fn:id=>todoToggle(id)}],
 print(){const rows=S.todos.filter(x=>!x.erledigt).sort((a,b)=>(a.faellig||'9')<(b.faellig||'9')?-1:1);printDoc(docListe('Offene Aufgaben',S.meta.behoerde+' · Stand: '+fmtD(today()),['Aufgabe','Fällig','Priorität','Zuständig','Angelegt von'],rows.map(x=>[x.titel,fmtD(x.faellig),x.prio||'normal',(x.zustaendig||['alle']).map(kurzName).join(', '),kurzName(x.von_pid)])),'Aufgaben')}
};

function todoDlg(id){
 const x=id?S.todos.find(y=>y.id===id):null;
 const F=[{k:'titel',l:'Aufgabe',req:1},{k:'faellig',l:'Fällig am',t:'date'},{k:'prio',l:'Priorität',t:'select',o:['hoch','normal','niedrig']},{k:'text',l:'Beschreibung',t:'textarea',rows:5}];
